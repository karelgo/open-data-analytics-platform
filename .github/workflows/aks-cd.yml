# Continuous deploy: bij elke push naar main re-apply alle platform-manifests
# on the AKS cluster en publish een verse portal-bundle.
#
# Smoke draait NIET hier — die zit in .github/workflows/aks-smoke.yml en
# wordt automatisch getriggerd via `workflow_run` zodra deze CD groen is.
# Voor handmatige deploys met fijnmazige toggles: gebruik
# .github/workflows/aks-deploy.yml (workflow_dispatch).
#
# Path-filter: alleen runnen als iets verandert dat het cluster-state
# beïnvloedt. Doc-only of data-generation changes triggeren géén deploy.
#
# Requirede secret: AZURE_CREDENTIALS (zie aks-deploy.yml header).
name: aks-cd

on:
  workflow_dispatch:

# Eén AKS-deploy tegelijk. Niet cancellen — een half afgebroken apply
# kan het cluster in een rare staat achterlaten. Queue liever (zelfde
# group als aks-deploy.yml zodat manual + auto elkaar niet bijten).
concurrency:
  group: aks-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: read   # ghcr.io image-pulls (portal-build dependencies)

env:
  AKS_RESOURCE_GROUP: dev-stackable-rg
  AKS_CLUSTER_NAME:   odap-platform-aks

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo @ ${{ github.sha }}
        uses: actions/checkout@v6

      - name: Setup Python (voor render-trino-catalogs.py)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML (vereist door render-trino-catalogs.py)
        run: pip install pyyaml

      - name: Setup Node.js (voor portal-build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: portal/package-lock.json

      - name: Azure login (service principal)
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check AKS cluster powerState
        # Als `make aks-stop` / `make aks-hibernate` is gedraaid staat de API-
        # server uit én verdwijnt de FQDN uit Azure-DNS → kubectl faalt met
        # "no such host". Dan willen we de pipeline niet rood laten gaan;
        # cluster bewust uit = "skip deploy", zichtbaar als ::warning::.
        # Zet SKIP_DEPLOY=true en alle volgende steps no-op'en zichzelf.
        id: power
        run: |
          STATE=$(az aks show \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --query powerState.code -o tsv 2>/dev/null || echo "Unknown")
          echo "Cluster powerState: $STATE"
          if [[ "$STATE" != "Running" ]]; then
            echo "::warning title=AKS cluster is $STATE::Deploy skipped — run \`make aks-start\` (of \`make aks-wake\`) en re-trigger deze workflow."
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
          fi

      - name: Get AKS kubeconfig
        if: env.SKIP_DEPLOY != 'true'
        run: |
          az aks get-credentials \
            --resource-group "$AKS_RESOURCE_GROUP" \
            --name "$AKS_CLUSTER_NAME" \
            --overwrite-existing
          kubectl config current-context
          kubectl get nodes -o wide

      - name: Apply platform manifests (make aks-deploy)
        if: env.SKIP_DEPLOY != 'true'
        run: make aks-deploy

      - name: Build + publish portal (make aks-portal-publish)
        if: env.SKIP_DEPLOY != 'true'
        # KNOWN-BROKEN: portal-publish.sh ships portal/dist via a Kubernetes
        # ConfigMap (binaryData, max 1 MiB). Astro's static bundle grew past
        # that ceiling (~7.8 MB uncompressed, ~2-3 MB gzipped). Fix requires
        # switching to a registry push (ACR or ghcr.io) + image pull in the
        # platform-landing Deployment — tracked as a follow-up.
        # Continue-on-error so the rest of the deploy still goes through:
        # the previously-published portal-bundle in the cluster stays live.
        continue-on-error: true
        run: make aks-portal-publish

      - name: Dump pod-status bij failure
        if: failure() && env.SKIP_DEPLOY != 'true'
        run: |
          echo "::group::Pods across platform namespaces"
          for ns in odap-platform odap-auth odap-data odap-meta ingress-nginx; do
            echo "--- $ns ---"
            kubectl -n "$ns" get pods -o wide 2>/dev/null || true
          done
          echo "::endgroup::"
          echo "::group::Recent events (laatste 50)"
          kubectl get events --all-namespaces \
            --sort-by=.lastTimestamp 2>/dev/null \
            | tail -n 50 || true
          echo "::endgroup::"
