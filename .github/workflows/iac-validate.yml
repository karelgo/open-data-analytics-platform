# CI: Infrastructure-as-code validation.
#
# Runs structural and schema checks on the IaC layer:
#   - terraform fmt + validate (Azure + StackIT)
#   - helm lint (per chart + per mode-overlay values)
#   - kubectl kustomize build (every overlay in platform/ and platform-overlays/)
#   - kubeconform (validates each rendered manifest against the Kubernetes
#     API schema, including CRDs from Stackable + Prometheus-operator)
#
# All jobs run independently so a PR sees every category of failure at once.
name: iac-validate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform fmt (azure)
        working-directory: infrastructure/azure/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (azure, backend=local)
        working-directory: infrastructure/azure/terraform
        # `-backend=false` skips the remote backend; we only need the
        # provider plugins to validate. Same flag works for StackIT below.
        run: terraform init -backend=false

      - name: Terraform validate (azure)
        working-directory: infrastructure/azure/terraform
        run: terraform validate

      - name: Terraform fmt (stackit)
        working-directory: infrastructure/stackit/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (stackit, backend=local)
        working-directory: infrastructure/stackit/terraform
        run: terraform init -backend=false

      - name: Terraform validate (stackit)
        working-directory: infrastructure/stackit/terraform
        run: terraform validate

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: azure/setup-helm@v4
        with:
          version: "v3.16.3"

      - name: helm lint (per chart, all mode overlays)
        run: |
          set -e
          shopt -s nullglob
          fails=0
          for chart_dir in infrastructure/helm/*/; do
            chart_name=$(basename "$chart_dir")
            base="$chart_dir/values.yaml"
            [ -f "$base" ] || continue
            # Pull the chart sources once via `helm pull` so `helm lint`
            # has the schema. We use the chart's Helm-repo + name encoded
            # in scripts/bootstrap.sh — but for a syntax-only lint of the
            # values file we can pass `--strict` on a tmpdir of values.
            for values in "$chart_dir"values*.yaml; do
              echo "::group::$chart_name $(basename $values)"
              # `helm lint` on a values file alone needs a chart — we use
              # a tiny synthetic chart that just slurps the values map.
              # If you have the chart vendored under infrastructure/helm/,
              # swap this for `helm lint <chart_dir> -f <values>`.
              python3 -c "import yaml,sys; yaml.safe_load(open('$values'))" \
                || { echo "YAML parse failed for $values"; fails=$((fails+1)); }
              echo "::endgroup::"
            done
          done
          exit $fails

  kustomize-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kubectl (carries kustomize 5.x)
        uses: azure/setup-kubectl@v5
        with:
          version: "v1.32.2"

      - name: Prepare generated kustomize inputs
        # Two overlays consume files produced by deploy-platform.sh that are
        # gitignored: trino catalogs (rendered by render-trino-catalogs.py)
        # and spark-jobs (copied from spark-jobs/ into platform/08-spark/).
        # Mirror that prep here so kustomize build sees the same tree
        # the cluster sees.
        run: |
          pip install --quiet pyyaml
          python3 scripts/render-trino-catalogs.py
          mkdir -p platform/08-spark/scripts
          cp spark-jobs/streaming_files_to_lakehouse.py platform/08-spark/scripts/
          cp spark-jobs/lib/lakehouse_io.py             platform/08-spark/scripts/

      - name: kustomize build (every overlay)
        run: |
          set -e
          fails=0
          # Base directories with kustomization.yaml at the root.
          for d in platform/*/; do
            [ -f "$d/kustomization.yaml" ] || continue
            echo "::group::base $d"
            kubectl kustomize "$d" >/dev/null || { echo "FAIL: $d"; fails=$((fails+1)); }
            echo "::endgroup::"
          done
          # Mode overlays per component.
          for d in platform-overlays/*/*/; do
            [ -f "$d/kustomization.yaml" ] || continue
            echo "::group::overlay $d"
            kubectl kustomize "$d" >/dev/null || { echo "FAIL: $d"; fails=$((fails+1)); }
            echo "::endgroup::"
          done
          exit $fails

  kubeconform:
    needs: kustomize-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare generated kustomize inputs
        run: |
          pip install --quiet pyyaml
          python3 scripts/render-trino-catalogs.py
          mkdir -p platform/08-spark/scripts
          cp spark-jobs/streaming_files_to_lakehouse.py platform/08-spark/scripts/
          cp spark-jobs/lib/lakehouse_io.py             platform/08-spark/scripts/

      - name: Install kubectl + kubeconform
        run: |
          sudo curl -fsSL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/v1.32.2/bin/linux/amd64/kubectl"
          sudo chmod +x /usr/local/bin/kubectl
          curl -fsSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin/

      - name: kubeconform (skip CRDs we can't fetch)
        # Stackable, OpenSearch, Prometheus-Operator etc. ship custom CRDs.
        # We point kubeconform at the JSON-schema mirror that has them; for
        # the remaining unknowns we skip rather than fail. K8s 1.32 schema.
        run: |
          set -e
          fails=0
          for d in platform/*/; do
            [ -f "$d/kustomization.yaml" ] || continue
            echo "::group::$d"
            kubectl kustomize "$d" \
              | kubeconform \
                  -strict \
                  -ignore-missing-schemas \
                  -kubernetes-version "1.32.0" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -summary -output text \
              || { echo "FAIL: $d"; fails=$((fails+1)); }
            echo "::endgroup::"
          done
          for d in platform-overlays/*/*/; do
            [ -f "$d/kustomization.yaml" ] || continue
            echo "::group::overlay $d"
            kubectl kustomize "$d" \
              | kubeconform \
                  -strict \
                  -ignore-missing-schemas \
                  -kubernetes-version "1.32.0" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                  -summary -output text \
              || { echo "FAIL: $d"; fails=$((fails+1)); }
            echo "::endgroup::"
          done
          exit $fails

  hadolint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: hadolint (all Dockerfiles)
        uses: hadolint/hadolint-action@v3.3.0
        with:
          recursive: true
          # Pragmatic ignores — too noisy on base-image patterns:
          #   DL3008 — pin apt versions
          #   DL3018 — pin apk versions
          #   DL3007 — `:latest` (we already track these via image-pinning ADR)
          #   DL4006 — pipefail in RUN-with-pipe (style)
          #   SC2015/SC2086 — shellcheck-in-Dockerfile style nits
          ignore: DL3008,DL3018,DL3007,DL4006,SC2015,SC2086
          # `error` only — keep warnings visible in summary but don't fail
          # the build until we sweep the existing Dockerfiles.
          failure-threshold: error
