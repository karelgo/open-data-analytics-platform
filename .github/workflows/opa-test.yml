# CI: opa test — voert alle Rego-tests uit (23 tests in fase 9).
# Faalt bij ANY test-failure of fmt-diff.
name: opa-test

on:
  workflow_dispatch:

jobs:
  opa-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OPA
        run: |
          sudo curl -fsSL -o /usr/local/bin/opa \
            https://openpolicyagent.org/downloads/v0.69.0/opa_linux_amd64_static
          sudo chmod +x /usr/local/bin/opa
          opa version

      - name: opa fmt --diff
        run: opa fmt --diff opa-policies-src/trino/

      - name: Wrap test data (Stackable bundle-path)
        # Wraps opa-policies-src/data/role_mappings.json onder
        # data.configmap["opa-trino-bundle"]["odap-platform"] zodat
        # `opa test` dezelfde paden ziet als de Stackable OpaCluster
        # in productie. Zonder dit falen alle policy-tests omdat de
        # rego-regels via `data.configmap.[...]` lezen.
        run: |
          python3 scripts/opa-test-data-wrap.py \
            --src opa-policies-src/data/role_mappings.json \
            --dst /tmp/opa-test-data.json

      - name: opa test (verbose)
        # `opa test` exits non-zero on any failing test — no extra flag
        # needed. (--fail-on-coverage was renamed in newer OPA versions;
        # we skip coverage gating until we set a meaningful threshold.)
        run: |
          opa test \
            opa-policies-src/trino/ \
            /tmp/opa-test-data.json \
            -v

      - name: Build bundle (sanity)
        run: bash scripts/build-opa-bundle.sh
