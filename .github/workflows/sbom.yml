# CI: SBOM generation for first-party artifacts (R-NIS2-03 supply-chain).
#
# Emits a CycloneDX SBOM per first-party component and uploads it as a
# workflow artifact. On release tags the SBOMs can be attached to the
# GitHub Release via a follow-up step (TODO).
name: sbom

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # anchore/sbom-action uploads its own artifact when `artifact-name` is set,
  # so we don't add a second actions/upload-artifact step (that triggered a
  # 409 Conflict — "an artifact with this name already exists"). Default
  # retention follows the repo Actions setting.
  sbom-job-market:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM (job market)
        uses: anchore/sbom-action@v0
        with:
          path: ./examples/dutch-it-jobs
          format: cyclonedx-json
          output-file: sbom-job-market.cdx.json
          artifact-name: sbom-job-market

  sbom-spark-jobs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM (spark-jobs)
        uses: anchore/sbom-action@v0
        with:
          path: ./spark-jobs
          format: cyclonedx-json
          output-file: sbom-spark-jobs.cdx.json
          artifact-name: sbom-spark-jobs

  sbom-dbt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM (dbt project)
        uses: anchore/sbom-action@v0
        with:
          path: ./dbt
          format: cyclonedx-json
          output-file: sbom-dbt.cdx.json
          artifact-name: sbom-dbt

  sbom-portal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Generate SBOM (portal)
        uses: anchore/sbom-action@v0
        with:
          path: ./portal
          format: cyclonedx-json
          output-file: sbom-portal.cdx.json
          artifact-name: sbom-portal
