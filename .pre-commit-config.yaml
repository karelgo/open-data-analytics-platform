# Improvements #8 — pre-commit hooks.
#
# Installeer:
#   pip install pre-commit
#   pre-commit install
#
# Run on alles:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(infrastructure/helm/keycloak/realm\.json)$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents, --unsafe]
        # --unsafe staat Python-tags toe (mkdocs.yml gebruikt
        # !!python/name:material.extensions.emoji.twemoji); zonder die
        # vlag faalt check-yaml on the root config.
        exclude: '^(platform/09-trino/catalogs/.*\.yaml\.tmpl)$'
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        args: [-c, ci/yamllint.yaml]
        files: '^(platform|infrastructure|ci)/.*\.ya?ml$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        files: '^(data-generation|spark-jobs|platform/11-airflow/dags|ci/scripts)/'
      - id: ruff-format
        files: '^(data-generation|spark-jobs|platform/11-airflow/dags|ci/scripts)/'

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        # --severity=warning skips style/info hints (e.g. SC2016 "single-quote
        # $"; SC2002 "useless cat"; SC2295 "quote inside ${...}"). Real bugs
        # (error+warning) still block the commit.
        #
        # Exclude-codes — pragmatic for this repo:
        #   SC1091 — source: file follows; we have many runtime-sourced libs
        #   SC2086 — quote vars; mostly intentional flag-expansion
        #   SC2034 — unused var; loop counters `for i in ...` are fine
        #   SC2046 — quote $(...); intentional: $(chart_value_args …)
        #            returns multiple `--values` flags that need word-splitting
        #   SC2155 — declare+assign; common pattern in our scripts
        #   SC2015 — A && B || C; intentional in many one-liners
        args:
          - --severity=warning
          - --exclude=SC1091,SC2086,SC2034,SC2046,SC2155,SC2015

  # Lokaal: opa fmt — vereist `opa` in PATH.
  - repo: local
    hooks:
      - id: opa-fmt
        name: opa fmt
        entry: opa fmt --diff
        language: system
        files: '^opa-policies-src/.*\.rego$'
        pass_filenames: true

      - id: dbt-meta-check
        name: dbt meta-block check
        entry: python3 ci/scripts/check-dbt-meta.py
        language: system
        files: '^dbt/models/.*_.*\.yml$'
        pass_filenames: false

      # Regenereer MkDocs-pagina's from the portal-registry zodra de bron óf de
      # generator zelf wijzigt. Pure stdlib, geen externe deps. Spiegelt de
      # `docs_gen.py --check` stap in .github/workflows/docs.yml — die blijft
      # als safety net staan for the geval pre-commit geskipt wordt.
      - id: docs-gen
        name: regenerate component pages
        entry: python3 scripts/docs_gen.py
        language: system
        files: '^(portal/src/data/components\.ts|scripts/docs_gen\.py|SECURITY\.md)$'
        pass_filenames: false
