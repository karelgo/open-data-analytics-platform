name: odap_data_platform
version: 0.2.0
config-version: 2
profile: trino_default
model-paths:
- models
seed-paths:
- seeds
test-paths:
- tests
macro-paths:
- macros
target-path: target
clean-targets:
- target
- dbt_packages
vars:
  table_format: '{{ env_var(''TABLE_FORMAT'', ''delta'') }}'
on-run-start:
- '{{ ensure_schemas() }}'
models:
  odap_data_platform:
    +schema: job_market
    +on_table_exists: replace
    +meta:
      owner: labour-market-data-team
      use_case: dutch-it-job-market
      classification: public-job-advertisement
      purpose: labour-market-analysis
      domain: job_market
      purpose-limitation:
      - labour_market_research
      bio_classificatie: intern
      eigenaar: data_platform
      pii_kolommen: []
      legal_basis: source_permission_required
      retention period_jaren: 1
      risk_tier: laag
      cgm_entiteiten:
      - JobPosting
      - DailySnapshot
    staging:
      +database: silver
      +materialized: view
    intermediate:
      +database: silver
      +materialized: view
    marts:
      +database: gold
      +materialized: table
    +tags:
    - job_market
