# Keycloak — StackIT SKE overrides.
#
# Bitnami's public Docker images were purged mid-2025; community mirror at
# bitnamilegacy/* keeps the chart working. Same fix applies on any cloud.
#
# Public DNS hostname on standard 443. iss in issued tokens will be
# https://keycloak.example.com/realms/odap regardless of whether the
# call came from the browser (public hostname) or in-cluster apps using the
# Service name — apps need to expect the public iss either way.

image:
  repository: bitnamilegacy/keycloak

postgresql:
  image:
    repository: bitnamilegacy/postgresql

auth:
  realm: master
  frontendUrl: "https://keycloak.example.com"

extraEnvVars:
  - name: KC_HOSTNAME
    value: "https://keycloak.example.com"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_BACKCHANNEL
    value: "false"
  - name: KC_PROXY_HEADERS
    value: "xforwarded"

# The chart-managed ingress on keycloak.odap.local stays in place
# for in-cluster CoreDNS routing of OIDC backchannel discovery. The public
# keycloak.example.com ingress (with LE cert) lives in Phase 4 at
# infrastructure/stackit/public-ingresses.yaml.
