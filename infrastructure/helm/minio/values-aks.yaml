# MinIO — AKS-specific overrides.
#
# Replaces the k3d-only `local-path` storage class with AKS's Standard SSD CSI
# class, and bumps capacity to a more realistic cloud size. Merged on top of
# infrastructure/helm/minio/values.yaml via a second --values flag.
#
# storageClass note: 'managed-csi' (Standard SSD) is ~5x cheaper than
# 'managed-csi-premium' (~€12/mo per 100Gi saved) and ample for S3-style
# object I/O in a reference platform. Flip to 'managed-csi-premium' only if
# you actually need <1ms p99 reads (analytical workloads typically don't).

persistence:
  storageClass: "managed-csi"
  size: 100Gi

# Chart-managed ingress hostnames stay on .odap.local (in-cluster
# routing). Public AKS access at *.example.com is served
# by infrastructure/azure/public-ingresses.yaml (`minio-public` + `minio-api-public`).

# OIDC URLs visible to the browser must match the public hostname.
# CORS-origin lijst moet de publieke portal-host bevatten zodat de browser
# vanuit https://platform.example.com mag PUTten naar
# https://minio-api.example.com.
environment:
  MINIO_IDENTITY_OPENID_CONFIG_URL: "https://keycloak.example.com/realms/odap/.well-known/openid-configuration"
  MINIO_IDENTITY_OPENID_REDIRECT_URI: "https://minio.example.com/oauth_callback"
  MINIO_API_CORS_ALLOW_ORIGIN: "https://platform.example.com"
