# MinIO — single-node, single-drive (k3d / scaled-down)
#
# In productie: distributed mode (4+ nodes met EC). Voor referentie volstaat
# een enkele Pod. Buckets worden door bootstrap.sh aangemaakt via mc-job.
#
# Chart: minio/minio

mode: standalone

# Storage — storageClass + size set per-mode in values-{k3d,aks}.yaml.
persistence:
  enabled: true
  accessMode: ReadWriteOnce

# Auth (DEV ONLY — vervangen in productie via Secret)
# Voor reproduceerbaarheid in dev hardcoded; bootstrap waarschuwt expliciet.
rootUser: "platformadmin"
rootPassword: "odap-dev-only-CHANGE-ME"

# Resources
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

# Buckets aanmaken via een post-install Job (werkt op standalone mode)
buckets:
  - name: odap-raw
    policy: none
    purge: false
  - name: odap-bronze
    policy: none
    purge: false
  - name: odap-silver
    policy: none
    purge: false
  - name: odap-gold
    policy: none
    purge: false
  - name: sensitive
    policy: none
    purge: false
  - name: odap-staging
    policy: none
    purge: false
  - name: odap-checkpoints
    policy: none
    purge: false
  - name: odap-meta
    policy: none
    purge: false

# Service exposure
service:
  type: ClusterIP
  port: 9000

consoleService:
  type: ClusterIP
  port: 9001

# Ingress voor MinIO API + Console (UI). Chart-managed; stays on .local
# on every mode (used for in-cluster routing). The PUBLIC AKS access lives
# in infrastructure/azure/public-ingresses.yaml (`minio-public`, `minio-api-public`).
# backend-protocol HTTPS + ssl-verify off omdat tls.enabled=true (zie
# onder) — zonder deze annotaties spreekt nginx-ingress HTTP naar de
# TLS-luisterende MinIO pod = timeout.
ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: platform-issuer
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
  hosts:
    - minio.odap.local
  tls:
    - hosts: [minio.odap.local]
      secretName: minio-tls

consoleIngress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: platform-issuer
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    # MinIO Console iframe-allow voor portal embed-shell (cross-origin).
    # Console hard-codet OIDC-callback op /oauth_callback dus blijft op
    # eigen subdomein i.p.v. path-routed; we strippen X-Frame-Options
    # en zetten frame-ancestors zodat portal-shell 'm kan iframen.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_hide_header X-Frame-Options;
      add_header Content-Security-Policy "frame-ancestors 'self' https://platform.odap.local:8443 https://platform.example.com https://platform.example.com" always;
  hosts:
    - minio-console.odap.local
  tls:
    - hosts: [minio-console.odap.local]
      secretName: minio-console-tls

# In-cluster TLS aan: Trino 469+ vereist TLS voor S3 connections.
# Cert komt uit cert-manager Certificate `minio-tls-internal` (zie
# platform/03-storage/minio-cert.yaml). MinIO chart verwacht keys
# 'public.crt' + 'private.key' — die staan in cert-manager-secret als
# tls.crt/tls.key, dus we hebben een aparte mount-fixup nodig of we
# kopieren ze. Voor referentie: simpele copy via init.
tls:
  enabled: true
  certSecret: "minio-tls-internal-fixed"
  publicCrt: public.crt
  privateKey: private.key

# OIDC SSO via Keycloak voor de MinIO Console.
# Browser-flow: console redirect naar https://keycloak.odap.local:8443
# (via KC_HOSTNAME). Backend MinIO doet OIDC discovery via dezelfde URL —
# vereist dat de pod keycloak.odap.local in-cluster kan resolveren
# (zie platform/02-authentication/keycloak-external-svc.yaml + CoreDNS).
# Cert-manager CA is nodig voor TLS-verify; mount via extraVolumes.
#
# CORS — de portal-CSV-upload doet vanuit https://platform.odap.local:8443
# een AssumeRoleWithWebIdentity + PUT naar https://minio.odap.local:8443.
# Cross-origin browser-PUT vereist dat MinIO de portal-origin in de CORS-header
# whitelist heeft.
environment:
  MINIO_IDENTITY_OPENID_CONFIG_URL: "https://keycloak.odap.local:8443/realms/odap/.well-known/openid-configuration"
  MINIO_IDENTITY_OPENID_CLIENT_ID: "minio"
  MINIO_IDENTITY_OPENID_CLIENT_SECRET: "odap-dev-only-CHANGE-ME-minio-secret"
  MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Keycloak (ODAP)"
  MINIO_IDENTITY_OPENID_CLAIM_NAME: "policy"
  MINIO_IDENTITY_OPENID_REDIRECT_URI: "https://minio-console.odap.local:8443/oauth_callback"
  MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email,roles"
  MINIO_API_CORS_ALLOW_ORIGIN: "https://platform.odap.local:8443,https://platform.odap.local"
  SSL_CERT_FILE: "/etc/platform-ca/ca.crt"
  CURL_CA_BUNDLE: "/etc/platform-ca/ca.crt"

# Named policies — chart maakt deze aan via post-install mc-job
# (`mc admin policy create`). De 'csv-uploader' policy wordt door MinIO
# toegekend aan gebruikers met user-attribute policy=csv-uploader in Keycloak
# (zie infrastructure/helm/keycloak/realm.json) na een
# AssumeRoleWithWebIdentity STS-call vanuit de portal.
policies:
  - name: csv-uploader
    statements:
      # 1a. WRITE — generic uploads (portal /csv-upload page).
      # Per-user prefix: uploads/<sanitized-email>/<ts>/<filename>. De portal
      # sanitiseert browser-side; de airflow-bridge sidecar valideert dat het
      # prefix overeenkomt met X-Auth-Request-Email vóór trigger.
      - effect: Allow
        resources:
          - "arn:aws:s3:::odap-staging/uploads/*"
        actions:
          - "s3:PutObject"
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
      # 1b. WRITE — legacy bron-specifieke CSV-staging (mc CLI / Airflow watcher).
      # Behouden zodat `mc cp … incoming/<bron>/…` blijft werken voor
      # bestaande customer_satisfaction/focus_billing flows.
      - effect: Allow
        resources:
          - "arn:aws:s3:::odap-staging/incoming/*"
        actions:
          - "s3:PutObject"
          - "s3:AbortMultipartUpload"
          - "s3:ListMultipartUploadParts"
      # 2. BUCKET-LOCATE — vereist door S3-clients voor regio-detectie.
      # MAG geen s3:prefix-conditie hebben (MinIO weigert: "unsupported
      # condition keys '[s3:prefix]' used for action 's3:GetBucketLocation'").
      # Alle vier buckets nodig omdat we via portal MinIO-console-deeplinks
      # naar processed/, bronze/, silver/ en gold/ openen.
      - effect: Allow
        resources:
          - "arn:aws:s3:::odap-staging"
          - "arn:aws:s3:::odap-bronze"
          - "arn:aws:s3:::odap-silver"
          - "arn:aws:s3:::odap-gold"
        actions:
          - "s3:GetBucketLocation"
      # 3. LIST — folder-listing per laag. Geen s3:prefix-conditie meer
      # omdat de gebruiker via de portal-deeplinks ook naar processed/,
      # bronze/<table>/, gold/<uc>/ moet kunnen bladeren.
      - effect: Allow
        resources:
          - "arn:aws:s3:::odap-staging"
          - "arn:aws:s3:::odap-bronze"
          - "arn:aws:s3:::odap-silver"
          - "arn:aws:s3:::odap-gold"
        actions:
          - "s3:ListBucket"
      # 4. READ — alleen-lezen op processed-archief, eigen uploads + alle
      # bronze/silver/gold. Maakt "Inkijken"-sectie in portal werkend.
      # Let op: omvat de hele data-lake; voor productie zou je per use-case
      # een eigen policy maken zodat een UC-12-uploader geen UC-11-PII kan zien.
      - effect: Allow
        resources:
          - "arn:aws:s3:::odap-staging/processed/*"
          - "arn:aws:s3:::odap-staging/uploads/*"
          - "arn:aws:s3:::odap-bronze/*"
          - "arn:aws:s3:::odap-silver/*"
          - "arn:aws:s3:::odap-gold/*"
        actions:
          - "s3:GetObject"

extraVolumes:
  - name: platform-ca
    configMap:
      name: platform-ca-bundle
extraVolumeMounts:
  - name: platform-ca
    mountPath: /etc/platform-ca
    readOnly: true

# Disable Bitnami-style metrics (chart heeft eigen metrics endpoint)
metrics:
  serviceMonitor:
    enabled: false
