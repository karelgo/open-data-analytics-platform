# OpenMetadata — StackIT SKE overrides.
#
# - storageClass: premium-perf1-stackit (SKE default cinder-csi tier).
# - openmetadata.config.openmetadata.host: 0.0.0.0
#   The chart default `openmetadata` resolves to the Service ClusterIP, which
#   the pod cannot bind to (only its pod IP or 0.0.0.0). Without this override
#   the OM Deployment crashloops with `BindException: Address not available`.
#   Mirrors the AKS workaround.
# - authentication URLs point at the public LE-served Keycloak.
# - extraInitContainers / extraVolumes / extraVolumeMounts / extraEnvs:
#   base values.yaml imports a platform-ca-bundle ConfigMap for the self-signed
#   dev CA. SKE uses LE-issued real certs, so empty them out (the ConfigMap
#   doesn't exist on cloud deployments — would cause missing-volume failure).

persistence:
  storageClass: "premium-perf1-stackit"
  size: 5Gi

openmetadata:
  config:
    openmetadata:
      host: 0.0.0.0

    authentication:
      authority: https://keycloak.example.com/realms/odap
      callbackUrl: https://openmetadata.example.com/callback
      publicKeys:
        - http://openmetadata.odap-meta.svc.cluster.local:8585/api/v1/system/config/jwks
        - https://keycloak.example.com/realms/odap/protocol/openid-connect/certs

      oidcConfiguration:
        discoveryUri: https://keycloak.example.com/realms/odap/.well-known/openid-configuration
        callbackUrl: https://openmetadata.example.com/callback
        serverUrl: https://openmetadata.example.com

    authorizer:
      principalDomain: example.com

# Chart-managed ingress.hosts stays on .odap.local — public SKE
# ingress at openmetadata.example.com lands in Phase 4 at
# infrastructure/stackit/public-ingresses.yaml.

# No self-signed CA on SKE — Let's Encrypt + default JDK trust store cover it.
extraInitContainers: []
extraVolumes: []
extraVolumeMounts: []
extraEnvs: []
