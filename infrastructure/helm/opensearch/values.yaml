# OpenSearch — gedeeld single-node cluster voor zowel Vector logs als
# OpenMetadata-search (per gebruikerskeuze, vraag 10 in master agent prompt).
#
# Index-prefix-conventie:
#   logs-YYYY.MM.DD       (Vector)
#   open_metadata*            (OpenMetadata-search-engine)
#
# Chart: opensearch-project/opensearch
# Productie: ≥ 3 master-eligible nodes met data-tier-rollen + dedicated security.
---
clusterName: opensearch
nodeGroup: master
masterService: opensearch

# Single-node setup
singleNode: true
replicas: 1

roles:
  - master
  - ingest
  - data
  - remote_cluster_client

# Resources (scaled-down voor k3d)
resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: 1000m
    memory: 2Gi

# Java heap + GC tuning.
#
# Heap = ~50% of pod memory (rest is direct buffers + JNI + page cache).
# 512m heap on a 2Gi pod fits k3d. AKS/StackIT overrides bump this in
# values-aks.yaml / values-stackit.yaml.
#
# G1GC + MaxGCPauseMillis=200ms gives tighter p99 query latencies than
# the default ParallelGC, which can stall the world for seconds under
# index pressure. The trade-off is slightly more CPU spent on GC — fine
# on a search/log node that's I/O-bound rather than CPU-bound.
opensearchJavaOpts: >-
  -Xms512m -Xmx512m
  -XX:+UseG1GC
  -XX:MaxGCPauseMillis=200
  -XX:InitiatingHeapOccupancyPercent=35
  -XX:+ExplicitGCInvokesConcurrent
  -XX:+ParallelRefProcEnabled
  -Djava.awt.headless=true

persistence:
  enabled: true
  # storageClass + size are set per-mode in values-{k3d,aks}.yaml.

# Security uit voor dev — Vector + OM kunnen dan zonder TLS/auth schrijven/lezen.
# Productie: enable security plugin + use root CA voor mTLS.
securityConfig:
  enabled: false

extraEnvs:
  # discovery.type wordt door de chart zelf gezet via singleNode/clusterName;
  # duplicate-key error als we 'm hier ook opvoeren.
  - name: DISABLE_SECURITY_PLUGIN
    value: "true"
  - name: bootstrap.memory_lock
    value: "false"

# Service exposure (in-cluster only)
service:
  type: ClusterIP
  httpPort: 9200
  transportPort: 9300

# Disable demo-config-loaders
sysctl:
  enabled: false
sysctlInit:
  enabled: false
