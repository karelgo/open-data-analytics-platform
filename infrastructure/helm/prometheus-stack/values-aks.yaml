# kube-prometheus-stack — AKS-specific overrides.

# Alertmanager AAN in AKS — receivers + email-relay-config komen uit de
# AlertmanagerConfig CR (gepatcht door platform-overlays/aks/14-monitoring/).
alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 2
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    alertmanagerConfigSelector:
      matchLabels:
        alertmanagerConfig: odap-platform
    alertmanagerConfigMatcherStrategy:
      type: None
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "managed-csi"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "managed-csi"

grafana:
  persistence:
    storageClassName: "managed-csi"
  # Chart-managed ingress blijft uit (base values.yaml). Public AKS-routing
  # gaat via infrastructure/azure/public-ingresses.yaml die platform.eu-
  # sovereigndataplatform.com/grafana proxyt naar prometheus-grafana service.
  # OIDC endpoints overridden naar publieke AKS-keycloak (Let's Encrypt,
  # geen skip-tls-verify nodig). root_url + redirect_uri matchen
  # platform.<TLD>/grafana subpath uit realm.json.
  grafana.ini:
    server:
      root_url: "https://platform.example.com/grafana/"
    auth.generic_oauth:
      auth_url: "https://keycloak.example.com/realms/odap/protocol/openid-connect/auth"
      token_url: "https://keycloak.example.com/realms/odap/protocol/openid-connect/token"
      api_url: "https://keycloak.example.com/realms/odap/protocol/openid-connect/userinfo"
      tls_skip_verify_insecure: false
