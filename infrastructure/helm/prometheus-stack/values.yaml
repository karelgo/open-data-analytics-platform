# kube-prometheus-stack — scaled-down voor k3d
#
# Levert: Prometheus, Alertmanager (uit), Grafana, kube-state-metrics,
# node-exporter, Prometheus Operator (incl. ServiceMonitor + PodMonitor CRDs).
# Andere charts (cert-manager, ingress-nginx, OpenMetadata) registreren
# ServiceMonitors zodra deze stack draait.
#
# Chart: prometheus-community/kube-prometheus-stack

defaultRules:
  create: true

# Alertmanager uit in dev (geen routes geconfigureerd)
alertmanager:
  enabled: false

# Prometheus zelf
prometheus:
  prometheusSpec:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    retention: 7d
    retentionSize: 5GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          # storageClassName is set per-mode in values-{k3d,aks}.yaml.
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 10Gi
    # Service- en PodMonitors uit alle namespaces oppakken
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    # Path-routing onder de portal-host. externalUrl wordt door Prometheus
    # gebruikt voor zelf-gegenereerde links (notification URLs, recordings).
    # routePrefix zorgt dat de UI z'n eigen assets onder /prometheus/* zoekt.
    # values-aks/values-stackit overrulen externalUrl met hun publieke domein.
    externalUrl: "https://platform.odap.local:8443/prometheus"
    routePrefix: "/prometheus"

# Grafana
grafana:
  enabled: true
  adminPassword: "odap-dev-only-CHANGE-ME"
  persistence:
    enabled: true
    # storageClassName is set per-mode in values-{k3d,aks}.yaml.
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  # Chart-managed Grafana ingress UIT — we serveren Grafana onder
  # platform.odap.local/grafana via een eigen ingress in
  # platform/14-monitoring/ingress-grafana.yaml (path-routing voor de
  # portal embed-shell). Public AKS access blijft via
  # infrastructure/azure/public-ingresses.yaml (`grafana-public`).
  ingress:
    enabled: false
  # Keycloak SSO via OIDC. De `grafana`-client zit in realm.json met
  # redirect-URIs voor alle drie de modes (k3d/aks/stackit). De k3d-defaults
  # staan hier; values-aks.yaml en values-stackit.yaml overrulen root_url +
  # de Keycloak-endpoints met de publieke domeinen.
  #
  # role_attribute_path: realm-roles uit `roles`-claim mappen op Grafana-rollen.
  # platform_admin → Admin, data_engineer → Editor, rest → Viewer.
  # oauth_auto_login: true → portal embed-shell (/embed/grafana/) stuurt direct
  # door naar Keycloak; bestaande SSO-sessie = geen handmatige klik nodig.
  # Break-glass admin login blijft bereikbaar via /grafana/login?disableAutoLogin=true.
  #
  # tls_skip_verify_insecure=true is dev-only nodig omdat de pod het self-signed
  # platform-issuer-cert van keycloak.odap.local niet kan verifiëren
  # (platform-ca-bundle ConfigMap zit in odap-platform, niet odap-monitoring; mounten
  # zou kunnen maar voegt complexiteit toe voor een dev-only opstelling).
  # values-aks/values-stackit zetten 'm uit (publieke Let's Encrypt-certs).
  #
  # assertNoLeakedSecrets=false: chart-default lint-check verbiedt secrets
  # inline in values. Onze hele repo gebruikt `odap-dev-only-CHANGE-ME-*`
  # placeholders openlijk (zie realm.json en dev-secrets.yaml), dus deze
  # check is hier inconsistent — productie zou via SealedSecrets/SOPS lopen.
  assertNoLeakedSecrets: false
  grafana.ini:
    server:
      # Path-routing onder de portal-host (zie platform/14-monitoring/
      # ingress-grafana.yaml). De chart-managed ingress is uit; alle
      # toegang gaat via /grafana-prefix. serve_from_sub_path zorgt dat
      # alle static-asset paths het /grafana-prefix krijgen.
      root_url: "https://platform.odap.local:8443/grafana/"
      serve_from_sub_path: true
    security:
      # Default X-Frame-Options=DENY blokkeert ook same-origin iframes
      # (alleen SAMEORIGIN/ALLOW-FROM doet wat de naam suggereert).
      # allow_embedding zet de header op SAMEORIGIN zodat de portal
      # embed-shell Grafana via een iframe kan tonen.
      allow_embedding: true
    auth:
      disable_login_form: false
      oauth_auto_login: true
    auth.generic_oauth:
      enabled: true
      name: "Keycloak"
      allow_sign_up: true
      client_id: "grafana"
      client_secret: "odap-dev-only-CHANGE-ME-grafana-secret"
      scopes: "openid profile email roles"
      auth_url: "https://keycloak.odap.local:8443/realms/odap/protocol/openid-connect/auth"
      token_url: "https://keycloak.odap.local:8443/realms/odap/protocol/openid-connect/token"
      api_url: "https://keycloak.odap.local:8443/realms/odap/protocol/openid-connect/userinfo"
      tls_skip_verify_insecure: true
      role_attribute_path: "contains(roles[*], 'platform_admin') && 'Admin' || contains(roles[*], 'data_engineer') && 'Editor' || 'Viewer'"
      role_attribute_strict: false
      login_attribute_path: "preferred_username"
      name_attribute_path: "name"
      email_attribute_path: "email"

# Operator
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# Onnodige onderdelen uit voor scaled-down
kubeApiServer:
  enabled: true
kubelet:
  enabled: true
kubeControllerManager:
  enabled: false  # in k3d niet als aparte pod
coreDns:
  enabled: true
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeStateMetrics:
  enabled: true
nodeExporter:
  enabled: true
