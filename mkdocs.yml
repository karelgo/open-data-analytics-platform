# Open Data & Analytics Platform — documentation site (MkDocs Material).
#
# Preview locally:
#   pip install -r requirements-docs.txt
#   mkdocs serve            # http://127.0.0.1:8000
#
# CI builds and publishes via .github/workflows/docs.yml to GitHub Pages.

site_name: Open Data & Analytics Platform
site_description: >-
  Documentation for the ODAP reference implementation of a compliant data and
  analytics platform — architecture, components, roles, use cases, and
  decisions.
site_url: https://karelgo.github.io/open-data-analytics-platform/
site_author: Open Data & Analytics Platform contributors

repo_name: karelgo/open-data-analytics-platform
repo_url: https://github.com/karelgo/open-data-analytics-platform
edit_uri: edit/main/docs/

# The full content tree lives under docs/ (existing layout). The architecture
# and components overview pages are generated by scripts/docs_gen.py from
# portal/src/data/components.ts and live under docs/architecture/ and
# docs/components/.
docs_dir: docs

# docs/README.md remains for GitHub-browse users, but the generated
# docs/index.md is the site landing. mkdocs would try to render both at `/`
# — explicitly exclude only the top-level README.
# (Sub-READMEs like handbooks/README.md should stay in the site.)
exclude_docs: |
  /README.md
  /README.md.bak
  /_snippets/*
  /archive/**

# Documentation content is English; technical identifiers (paths, column names,
# tool names) stay as in code (see docs/README.md § Conventions).
theme:
  name: material
  language: en
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye
  palette:
    # Dark (default) — matches portal amber accent.
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light theme
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark theme
  features:
    - navigation.instant       # SPA-style page transitions
    - navigation.instant.prefetch
    - navigation.tracking       # sync hash with current section
    - navigation.tabs           # top-level sections as tabs
    - navigation.tabs.sticky
    - navigation.sections       # sub-sections as bold headings
    - navigation.indexes        # README.md → section landing
    - navigation.top            # back-to-top button
    - navigation.footer         # prev/next links
    - toc.follow                # right-side TOC scrolls along
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit       # "edit on GitHub" pencil
    - announce.dismiss

plugins:
  - search:
      lang:
        - en
  - awesome-pages              # nav from .pages files if present; otherwise fallback to nav: below
  - tags

# Rewrite ../..-links to absolute GitHub URLs so references to files
# OUTSIDE docs/ (dbt/, opa-policies-src/, scripts/, ...) work on
# the published site. Source files remain unchanged.
hooks:
  - scripts/docs_hooks.py

markdown_extensions:
  # Standard Python-markdown features
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      toc_depth: 3
  # PyMdown — richer syntax (admonitions, tabs, code highlighting, mermaid)
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details          # collapsible admonitions
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
      base_path:
        - docs
        - .                    # files outside docs/ can also be snippeted
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Top-level navigation. README.md → "index" rewrite lives in scripts/docs_gen.py
# because we want both docs/README.md (repo) and docs/index.md (landing).
nav:
  - Home: index.md
  - Onboarding:
      - Overview: onboarding/index.md
  - Architecture:
      - Overview: architecture/index.md
      - Components: architecture/components.md
      - Data zones: architecture/datazones.md
      - Identity & authorization: architecture/auth.md
      - Table format abstraction: architecture/table-format.md
      - Naming conventions: architecture/naming.md
      - Original reference: architecture/reference.md
  - Job market:
      - Overview: use-cases/index.md
      - Walkthrough and dictionary: use-cases/dutch-it-job-market.md
      - Role handbooks: handbooks/README.md
      - Role scopes: roles/index.md
      - Job Market Analyst: handbooks/01-claims-analyst.md
      - Source Quality Analyst: handbooks/02-fraud-analyst.md
      - Skills Analyst: handbooks/04-marketing-analyst.md
      - Salary Analyst: handbooks/05-finance-analyst.md
      - Market Operations: handbooks/06-operations-manager.md
      - Labour Market Researcher: handbooks/08-researcher.md
      - Data Steward: handbooks/09-data-steward.md
      - Data Engineer: handbooks/10-data-engineer.md
      - Platform Admin: handbooks/11-platform-admin.md
      - Request access: access-request-guide.md
  - Decisions:
      - Overview: adr/index.md
      - ADR-0001 · Stackable as base: adr/0001-stackable-as-base.md
      - ADR-0002 · Iceberg vs Delta: adr/0002-iceberg-vs-delta.md
      - ADR-0003 · OPA as Trino authz: adr/0003-opa-as-trino-authz.md
      - ADR-0004 · OpenMetadata as catalog: adr/0004-openmetadata-as-catalog.md
      - ADR-0005 · dbt-trino as transformation layer: adr/0005-dbt-trino-as-transform.md
      - ADR-0006 · Delta chosen for this impl.: adr/0006-delta-chosen-for-this-implementation.md
      - ADR-0007 · Airflow pipeline architecture: adr/0007-airflow-pipeline-architecture.md
      - ADR-0008 · Self-service data access: adr/0008-self-service-data-access.md
      - Entra broker record: adr/0008-entra-broker-via-keycloak.md
      - ADR-0009 · NetworkPolicies strategy: adr/0009-networkpolicies-strategy.md
      - ADR-0010 · platform-config single source: adr/0010-platform-config-single-source.md
  - Compliance:
      - Compliance mapping: compliance-mapping.md
      - Context (GDPR / ISO 27001 / NIS2 / AI Act): context-summary.md
  - Operations:
      - Runbook: runbook.md
      - Deployment modes: deployment-modes.md
      - Security: security.md
      - Documentation gaps: documentation-gap-report.md
      - Roadmap & improvements: improvements.md
  - Audit & misc:
      - Architecture (legacy stub): architecture.md
      - Redesign inventory: redesign-inventory.md
      - Handbooks — index: handbooks/README.md
      - Explorations — Multica vs Nanitics: explorations/multica-vs-nanitics.md
      - Explorations — Multica Foundry: explorations/multica-foundry.md
      - Explorations — Watcher design: explorations/wachter-design.md
  - Tags: tags.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/karelgo/open-data-analytics-platform
      name: Repository on GitHub
  generator: false
  status:
    new: new
    deprecated: deprecated

extra_css:
  - assets/extra.css

# Strict build: broken refs, missing nav items and orphan files → failure.
# For the first publication we set 'warn' on nav so files that do not yet
# exist (like security.md, generated architecture pages before the first
# run) are allowed; the generator step creates them.
strict: true
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn

copyright: >-
  Apache License 2.0 ·
  <a href="https://github.com/karelgo/open-data-analytics-platform/blob/main/LICENSE">LICENSE</a> ·
  Offline example data is synthetic; live sources are explicitly configured.
