# Airflow 3 uses API and FAB base URLs (the webserver setting was removed).
- op: replace
  path: /spec/webservers/envOverrides/AIRFLOW__API__BASE_URL
  value: "https://platform.example.com/airflow"
- op: replace
  path: /spec/webservers/envOverrides/AIRFLOW__FAB__BASE_URL
  value: "https://platform.example.com/airflow"
- op: replace
  path: /spec/schedulers/envOverrides/AIRFLOW__API__BASE_URL
  value: "https://platform.example.com/airflow"
- op: replace
  path: /spec/schedulers/envOverrides/AIRFLOW__FAB__BASE_URL
  value: "https://platform.example.com/airflow"
