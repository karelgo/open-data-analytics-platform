# Strategic-merge patch on the Secret. Vervangt alleen de SMTP-velden;
# Slack-/PagerDuty-keys from the base blijven staan. Voor production hoort
# dit via External Secrets Operator + Vault te gaan; tot die er is patcht
# de operator hier de placeholders through the echte SMTP-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-receivers
  namespace: odap-monitoring
stringData:
  smtp_username: "alertmanager@example.com"
  smtp_password: "REPLACE_WITH_RELAY_PASSWORD"
