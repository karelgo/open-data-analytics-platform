# ODAP Platform namespaces — declaratief, met BIO-classificatie en purpose-limitation
# als labels/annotaties zodat OpenMetadata's K8s-connector ze later kan oogsten.
#
# Sommige namespaces worden ook door bootstrap.sh aangemaakt (idempotent
# kubectl apply). Dit bestand is de canonical bron.
---
apiVersion: v1
kind: Namespace
metadata:
  name: odap-platform
  labels:
    odap.io/zone: data-platform
    odap.io/environment: dev
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    odap.io/description: "Stackable data-platform workloads (Trino, Kafka, Spark, NiFi, etc.)"
    odap.io/bio-classificatie: "vertrouwelijk"
    odap.io/purpose-limitation: "primair_proces"
---
apiVersion: v1
kind: Namespace
metadata:
  name: odap-data
  labels:
    odap.io/zone: shared-data-services
    odap.io/environment: dev
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    odap.io/description: "Gedeelde data-services (PostgreSQL voor HMS/Airflow/Superset/OM/Keycloak)"
    odap.io/bio-classificatie: "vertrouwelijk"
    odap.io/purpose-limitation: "primair_proces"
---
apiVersion: v1
kind: Namespace
metadata:
  name: odap-meta
  labels:
    odap.io/zone: governance
    odap.io/environment: dev
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    odap.io/description: "Catalog, lineage en governance (OpenMetadata, OpenSearch)"
    odap.io/bio-classificatie: "intern"
    odap.io/purpose-limitation: "governance"
---
apiVersion: v1
kind: Namespace
metadata:
  name: odap-monitoring
  labels:
    odap.io/zone: observability
    odap.io/environment: dev
    pod-security.kubernetes.io/enforce: privileged
  annotations:
    odap.io/description: "Prometheus, Grafana, Alertmanager (privileged i.v.m. node-exporter)"
    odap.io/bio-classificatie: "intern"
    odap.io/purpose-limitation: "observability"
---
apiVersion: v1
kind: Namespace
metadata:
  name: odap-auth
  labels:
    odap.io/zone: identity
    odap.io/environment: dev
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    odap.io/description: "Keycloak (OIDC IdP, mock realm ODAP)"
    odap.io/bio-classificatie: "vertrouwelijk"
    odap.io/purpose-limitation: "authenticatie"
