# Platform-wide configuration — projected from platform-config.yaml at repo
# root. Components that need format/bucket/connection settings consume this
# ConfigMap via `envFrom` instead of hardcoding values in their manifests.
#
# Why duplicate the YAML?
#   - platform-config.yaml is read by Python helpers and shell scripts at
#     render-time (e.g. scripts/render-trino-catalogs.py, scripts/lib/mode.sh)
#   - This ConfigMap is the runtime mirror so Spark/Airflow/etc. pods see the
#     same source of truth from inside the cluster.
#
# Sync policy: when you edit platform-config.yaml, update the matching key
# here. CI gate (scripts/check-platform-config-sync.py — TODO) verifies they
# don't drift.
#
# Mode-aware values (dns suffix, etc.) live in the per-mode overlays under
# platform-overlays/<mode>/00-namespaces/.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: odap-platform
  labels:
    app.kubernetes.io/part-of: odap-platform
    app.kubernetes.io/component: platform-config
data:
  # ---- Table format ----
  TABLE_FORMAT: "delta"

  # ---- Catalog backend ----
  CATALOG_BACKEND: "hive_metastore"
  HIVE_METASTORE_URI: "thrift://hive-metastore:9083"

  # ---- Object store ----
  OBJECT_STORE: "minio"
  S3_ENDPOINT: "http://minio.odap-platform.svc.cluster.local:9000"

  # ---- Bucket layout ----
  BUCKET_RAW: "odap-raw"
  BUCKET_BRONZE: "odap-bronze"
  BUCKET_SILVER: "odap-silver"
  BUCKET_GOLD: "odap-gold"
  BUCKET_SENSITIVE: "sensitive"
  BUCKET_STAGING: "odap-staging"
  BUCKET_CHECKPOINTS: "odap-checkpoints"
  BUCKET_META: "odap-meta"

  # ---- Paths derived from buckets (convenient for jobs) ----
  RAW_PATH: "s3a://odap-raw/"
  BRONZE_PATH: "s3a://odap-bronze/"
  SILVER_PATH: "s3a://odap-silver/"
  GOLD_PATH: "s3a://odap-gold/"
  CHECKPOINTS_PATH: "s3a://odap-checkpoints/streaming"

  # ---- Region tag (metadata only, not a cloud region) ----
  REGION: "eu-nl-1"

  # ---- Scale profile ----
  SCALE_PROFILE: "scaled-down"

  USE_CASE: "dutch-it-job-market"
  JOBS_SCHEDULE: "0 5 * * *"
  JOBS_TIMEZONE: "Europe/Amsterdam"
  JOBS_MODE: "demo"
