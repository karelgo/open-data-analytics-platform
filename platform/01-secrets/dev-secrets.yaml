# =====================================================================
#  DEV-ONLY SECRETS — NIET VOOR PRODUCTIE
# =====================================================================
# Voor production: vervang dit bestand door SealedSecrets/SOPS-of
# external-secrets-operator + Vault-injection. De `stringData` waardes hier
# zijn placeholders die overeenkomen with the Helm-values van fase 1.
#
# Bootstrap-warning print de wachtwoorden bij `make bootstrap`.
# =====================================================================
---
# MinIO S3-credentials. Pickup-label: secrets.stackable.tech/class: s3-credentials-minio
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-credentials
  namespace: odap-platform
  labels:
    secrets.stackable.tech/class: s3-credentials-minio
    odap.io/dev-only: "true"
type: Opaque
stringData:
  accessKey: "platformadmin"
  secretKey: "odap-dev-only-CHANGE-ME"
---
# Hive Metastore → Postgres credentials.
# Stackable Hive 26.3 verwacht beide username + password in dezelfde Secret
# (clusterConfig.database.user is verwijderd from the 26.3 schema).
apiVersion: v1
kind: Secret
metadata:
  name: hive-postgres-credentials
  namespace: odap-platform
  labels:
    odap.io/dev-only: "true"
type: Opaque
stringData:
  username: "odap"
  password: "odap-dev-only-CHANGE-ME"
---
# OIDC client-secrets per Stackable-service. Pickup-label maakt ze beschikbaar
# for the oidc-client-credentials SecretClass.
apiVersion: v1
kind: Secret
metadata:
  name: trino-oidc-client
  namespace: odap-platform
  labels:
    secrets.stackable.tech/class: oidc-client-credentials
    odap.io/oidc-service: trino
    odap.io/dev-only: "true"
type: Opaque
stringData:
  clientId: "trino"
  clientSecret: "odap-dev-only-CHANGE-ME-trino-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: superset-oidc-client
  namespace: odap-platform
  labels:
    secrets.stackable.tech/class: oidc-client-credentials
    odap.io/oidc-service: superset
    odap.io/dev-only: "true"
type: Opaque
stringData:
  clientId: "superset"
  clientSecret: "odap-dev-only-CHANGE-ME-superset-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: airflow-oidc-client
  namespace: odap-platform
  labels:
    secrets.stackable.tech/class: oidc-client-credentials
    odap.io/oidc-service: airflow
    odap.io/dev-only: "true"
type: Opaque
stringData:
  clientId: "airflow"
  clientSecret: "odap-dev-only-CHANGE-ME-airflow-secret"
---
apiVersion: v1
kind: Secret
metadata:
  name: nifi-oidc-client
  namespace: odap-platform
  labels:
    secrets.stackable.tech/class: oidc-client-credentials
    odap.io/oidc-service: nifi
    odap.io/dev-only: "true"
type: Opaque
stringData:
  clientId: "nifi"
  clientSecret: "odap-dev-only-CHANGE-ME-nifi-secret"
---
# Database-credentials voor Airflow + Superset → Postgres (fase 6/7).
# Vooruit aanmaken zodat fase-flow ononderbroken is.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-postgres-credentials
  namespace: odap-platform
  labels:
    odap.io/dev-only: "true"
type: Opaque
stringData:
  # Stackable Airflow 26.3 verwacht zowel admin-user info als
  # connection-strings in dezelfde Secret.
  adminUser.username: "airflow"
  adminUser.firstname: "Air"
  adminUser.lastname: "Flow"
  adminUser.email: "airflow@odap.local"
  adminUser.password: "odap-dev-only-CHANGE-ME"
  connections.secretKey: "dev-secret-key-32-bytes-min-len"
  connections.sqlalchemyDatabaseUri: "postgresql+psycopg2://odap:odap-dev-only-CHANGE-ME@postgres-postgresql.odap-data.svc.cluster.local:5432/airflow"
  connections.celeryResultBackend: "db+postgresql://odap:odap-dev-only-CHANGE-ME@postgres-postgresql.odap-data.svc.cluster.local:5432/airflow"
  connections.celeryBrokerUrl: "redis://localhost:6379/0"
---
apiVersion: v1
kind: Secret
metadata:
  name: superset-postgres-credentials
  namespace: odap-platform
  labels:
    odap.io/dev-only: "true"
type: Opaque
stringData:
  # Stackable Superset 26.3 verwacht admin-user keys + connection-strings.
  adminUser.username: "admin"
  adminUser.firstname: "Super"
  adminUser.lastname: "Admin"
  adminUser.email: "superset@odap.local"
  adminUser.password: "odap-dev-only-CHANGE-ME"
  connections.secretKey: "dev-secret-key-32-bytes-min-len"
  connections.sqlalchemyDatabaseUri: "postgresql+psycopg2://odap:odap-dev-only-CHANGE-ME@postgres-postgresql.odap-data.svc.cluster.local:5432/superset"
---
# OpenMetadata admin + JWT-secret. JWT wordt door bootstrap-script gegenereerd
# (OM CLI: `metadata generate-token`), maar voor dev-seeding plaatsen we een
# placeholder — init-Job kan ook met basic-auth tegen /api/v1/users/login.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-admin
  namespace: odap-meta
  labels:
    odap.io/dev-only: "true"
type: Opaque
stringData:
  adminEmail: "admin@odap.local"
  adminPassword: "odap-dev-only-CHANGE-ME-OmAdmin2026"
  jwtToken: "REPLACE_VIA_metadata_generate_token_AT_BOOTSTRAP"
---
# OIDC client-secret voor OpenMetadata → Keycloak SSO.
# Komt overeen with the `openmetadata` client in realm.json (zie ook
# infrastructure/helm/keycloak/realm.json regel ~458). De Helm-chart
# (infrastructure/helm/openmetadata/values.yaml) refereert naar deze Secret
# via openmetadata.config.authentication.oidcConfiguration.secret.secretRef.
apiVersion: v1
kind: Secret
metadata:
  name: openmetadata-oidc-client
  namespace: odap-meta
  labels:
    odap.io/oidc-service: openmetadata
    odap.io/dev-only: "true"
type: Opaque
stringData:
  clientId: "openmetadata"
  clientSecret: "odap-dev-only-CHANGE-ME-openmetadata-secret"
---
# Chart 1.12 hardcodes een env-var `AIRFLOW_PASSWORD` die uit het
# Secret `airflow-secrets` (key `openmetadata-airflow-password`) komt,
# ook als pipelineServiceClientConfig.enabled=false (in onze setup
# rijden we ingest-workflows via Airflow's KubernetesPodOperator,
# niet via OM's eigen Airflow-client). Zonder dit Secret crasht het
# run-db-migrations initContainer met
# `secret "airflow-secrets" not found`. Dummy-waarde volstaat.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-secrets
  namespace: odap-meta
  labels:
    odap.io/dev-only: "true"
type: Opaque
stringData:
  openmetadata-airflow-password: "dummy-not-used-pipelineserviceclient-disabled"
---
# Airflow REST API technical-user credentials.
#
# Gebruikt door portal/scripts/airflow-bridge.py (sidecar in de portal-pod):
# de bridge ontvangt /api/airflow/trigger-convert POSTs vanuit de browser en
# triggert `convert_to_delta` via Airflow REST met deze creds.
#
# We hergebruiken de admin-credentials uit airflow-postgres-credentials
# (adminUser.username / adminUser.password). Voor production: maak een
# echte technical-user met scoped permissions (alleen dagRuns POST op
# specifieke DAG-IDs) via Airflow's CLI of REST API.
apiVersion: v1
kind: Secret
metadata:
  name: airflow-api-bot
  namespace: odap-platform
  labels:
    odap.io/dev-only: "true"
type: Opaque
stringData:
  username: "airflow"
  password: "odap-dev-only-CHANGE-ME"
---
# =====================================================================
#  Entra ID — IdP brokering via Keycloak (feature/entra-id-broker)
# =====================================================================
# Gegevens van de Azure-app-registration die als externe IdP federeert
# with the Keycloak `odap` realm. Worden geconsumeerd door:
#   - infrastructure/helm/keycloak/realm.json (identityProviders[0])
#   - infrastructure/helm/keycloak/values.yaml (extraEnvVarsSecret-mount)
#
# Dev/demo: alle 4 placeholders staan op REPLACE_ME — Keycloak start wel,
# maar de "Login met Microsoft Entra ID"-knop on the loginpagina werkt
# alleen na vervanging. Zie platform/02-authentication/README.md voor de
# stappen (Azure app-registration + group-GUIDs ophalen + realm.json
# patchen).
#
# Production: SealedSecret of External Secrets + Vault. De clientSecret
# wordt in Azure roterbaar gemaakt; KC pikt dat op via realm-import bij
# Keycloak-restart, of via Admin REST API patch.
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-entra-broker
  namespace: odap-auth
  labels:
    odap.io/idp-broker: entra
    odap.io/dev-only: "true"
type: Opaque
stringData:
  # GUID van de Azure tenant (bv. 11111111-1111-1111-1111-111111111111).
  tenantId: "REPLACE_ME_ENTRA_TENANT_ID"
  # Application (client) ID van de app-registration in Entra.
  clientId: "REPLACE_ME_ENTRA_CLIENT_ID"
  # Client-secret value from the app-registration (NIET de secret-ID).
  clientSecret: "REPLACE_ME_ENTRA_CLIENT_SECRET"
