# SparkApplication: seed-bronze-claims
#
# One-shot batch die N synthetische WIA-aanvraag-rijen direct in bronze
# Delta-formaat schrijft (s3a://odap-bronze/demo/claim_application/) en in HMS
# registreert als claims.application. Bedoeld om de Spark bronze→silver→gold
# demo van data te voorzien zolang streaming-bronze uit staat.
#
# BEWUST niet in platform/08-spark/kustomization.yaml resources —
# de seed mag NIET bij elke `kubectl apply -k` opnieuw draaien.
# Handmatig aanroepen:
#   kubectl delete sparkapplication seed-bronze-claims -n odap-platform --ignore-not-found
#   kubectl apply -f platform/08-spark/apps/seed-bronze-claims.yaml
#
# Status:
#   kubectl -n odap-platform get sparkapplication seed-bronze-claims
#
# Verifieer via Trino:
#   SELECT COUNT(*) FROM bronze.claims.application;
---
apiVersion: spark.stackable.tech/v1alpha1
kind: SparkApplication
metadata:
  name: seed-bronze-claims
  namespace: odap-platform
  labels:
    odap.io/zone: bronze
    odap.io/use-case: wia-spark-demo
spec:
  sparkImage:
    productVersion: "3.5.8"
  mode: cluster
  mainApplicationFile: "local:///stackable/spark/jobs/seed_bronze_claims.py"
  s3connection:
    reference: s3-minio
  deps:
    requirements: []
    packages:
      - io.delta:delta-spark_2.12:3.2.1
      - org.apache.hadoop:hadoop-aws:3.3.6
  sparkConf:
    spark.sql.shuffle.partitions: "4"
    # Tijdelijk false voor debug — driver-pod blijft staan zodat logs
    # readable zijn na failure. Terug naar true zodra het script werkt.
    spark.kubernetes.driver.deleteOnTermination: "false"
    spark.kubernetes.executor.deleteOnTermination: "false"
    # Event-logs → SparkHistoryServer (zie platform/08-spark/history-server.yaml).
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://odap-checkpoints/spark-events/"
  driver:
    config:
      logging:
        enableVectorAgent: false  # vector aggregator CM bestaat niet op deze cluster
      resources:
        cpu:
          min: "200m"
          max: "1000m"
        # 1.5Gi → na JVM-overhead ~900MB heap; Spark eist System memory >472MB
        # (zie INVALID_DRIVER_MEMORY). 512Mi resulteert in te weinig heap.
        memory:
          limit: "1500Mi"
    podOverrides:
      spec:
        containers:
          - name: spark
            envFrom:
              - configMapRef:
                  name: platform-config
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: accessKey
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: secretKey
              - name: SEED_ROWS
                value: "200"
            volumeMounts:
              - name: spark-jobs
                mountPath: /stackable/spark/jobs
        volumes:
          - name: spark-jobs
            configMap:
              name: spark-streaming-jobs
  executor:
    replicas: 1
    config:
      logging:
        enableVectorAgent: false  # vector aggregator CM bestaat niet op deze cluster
      resources:
        cpu:
          min: "200m"
          max: "1000m"
        # 1.5Gi → executor JVM heap >472MB (Spark-minimum); 768Mi was te krap.
        memory:
          limit: "1500Mi"
    podOverrides:
      spec:
        containers:
          - name: spark
            envFrom:
              - configMapRef:
                  name: platform-config
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: accessKey
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: secretKey
            volumeMounts:
              - name: spark-jobs
                mountPath: /stackable/spark/jobs
        volumes:
          - name: spark-jobs
            configMap:
              name: spark-streaming-jobs
