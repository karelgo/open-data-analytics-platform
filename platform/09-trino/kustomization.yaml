apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odap-platform
# Mode-overlay note: 09-trino has no aks/stackit overlay by design.
# Trino's listener class is `cluster-internal` (trinocluster.yaml:42),
# the coordinator UI is not exposed via Ingress, and the portal lists
# it with `embed: { mode: 'none' }` (portal/src/data/components.ts).
# End-users reach Trino via Superset / Jupyter / Airflow / dbt, all of
# which use the in-cluster Service. So the base manifests are correct
# for every mode and we deliberately skip a cloud-specific overlay.
resources:
  - trino-static-auth.yaml
  - trinocluster.yaml
  - catalogs/rendered  # gegenereerd door scripts/render-trino-catalogs.py
