apiVersion: airflow.stackable.tech/v1alpha1
kind: AirflowCluster
metadata:
  name: airflow
  namespace: odap-platform
spec:
  image:
    productVersion: 3.0.6
  clusterConfig:
    loadExamples: false
    exposeConfig: false
    credentialsSecret: airflow-postgres-credentials
    authentication:
    - authenticationClass: keycloak
      oidc:
        clientCredentialsSecret: airflow-oidc-client
  webservers:
    roleConfig:
      listenerClass: cluster-internal
    envOverrides:
      REQUESTS_CA_BUNDLE: /etc/platform-ca/ca.crt
      SSL_CERT_FILE: /etc/platform-ca/ca.crt
      AIRFLOW__API__BASE_URL: https://platform.odap.local:8443/airflow
      AIRFLOW__FAB__BASE_URL: https://platform.odap.local:8443/airflow
      AIRFLOW__FAB__ENABLE_PROXY_FIX: 'True'
      AIRFLOW__FAB__PROXY_FIX_X_PROTO: '1'
      AIRFLOW__FAB__PROXY_FIX_X_HOST: '1'
      AIRFLOW__FAB__PROXY_FIX_X_PORT: '1'
      AIRFLOW__FAB__PROXY_FIX_X_PREFIX: '1'
      PYTHONPATH: /opt/odap/airflow/include:/stackable/app/log_config:/stackable/airflow/dags
      AIRFLOW__CORE__EXECUTOR: KubernetesExecutor
      AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: odap-platform
    config:
      logging:
        enableVectorAgent: false
      resources:
        cpu:
          min: 100m
          max: 500m
        memory:
          limit: 1500Mi
    roleGroups:
      default:
        replicas: 1
        podOverrides:
          spec:
            containers:
            - name: airflow
              lifecycle:
                postStart:
                  exec:
                    command:
                    - bash
                    - -c
                    - |
                      for _ in $(seq 1 50); do
                        [ -f /stackable/airflow/webserver_config.py ] && break
                        sleep 0.1
                      done
                      cp -L /airflow-config/webserver_config.py \
                            /stackable/airflow/webserver_config.py
              volumeMounts:
              - name: platform-ca
                mountPath: /etc/platform-ca
                readOnly: true
              - name: airflow-include
                mountPath: /opt/odap/airflow/include
                readOnly: true
              - name: airflow-sources
                mountPath: /opt/odap/airflow/sources
                readOnly: true
              - name: airflow-dags
                mountPath: /stackable/airflow/dags
                readOnly: true
              - name: webserver-config
                mountPath: /airflow-config
                readOnly: true
            volumes:
            - name: platform-ca
              configMap:
                name: platform-ca-bundle
            - name: airflow-dags
              configMap:
                name: airflow-dags
            - name: airflow-include
              configMap:
                name: airflow-include
            - name: airflow-sources
              configMap:
                name: airflow-sources
            - name: webserver-config
              configMap:
                name: airflow-webserver-config
  schedulers:
    envOverrides:
      REQUESTS_CA_BUNDLE: /etc/platform-ca/ca.crt
      SSL_CERT_FILE: /etc/platform-ca/ca.crt
      AIRFLOW__API__BASE_URL: https://platform.odap.local:8443/airflow
      AIRFLOW__FAB__BASE_URL: https://platform.odap.local:8443/airflow
      AIRFLOW__FAB__ENABLE_PROXY_FIX: 'True'
      AIRFLOW__FAB__PROXY_FIX_X_PROTO: '1'
      AIRFLOW__FAB__PROXY_FIX_X_HOST: '1'
      AIRFLOW__FAB__PROXY_FIX_X_PORT: '1'
      AIRFLOW__FAB__PROXY_FIX_X_PREFIX: '1'
      PYTHONPATH: /opt/odap/airflow/include:/stackable/app/log_config:/stackable/airflow/dags
      AIRFLOW__CORE__EXECUTOR: KubernetesExecutor
      AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE: odap-platform
    config:
      logging:
        enableVectorAgent: false
      resources:
        cpu:
          min: 100m
          max: 1000m
        memory:
          limit: 2Gi
    roleGroups:
      default:
        replicas: 1
        podOverrides:
          spec:
            containers:
            - name: airflow
              volumeMounts:
              - name: platform-ca
                mountPath: /etc/platform-ca
                readOnly: true
              - name: airflow-include
                mountPath: /opt/odap/airflow/include
                readOnly: true
              - name: airflow-sources
                mountPath: /opt/odap/airflow/sources
                readOnly: true
              - name: airflow-dags
                mountPath: /stackable/airflow/dags
                readOnly: true
            volumes:
            - name: platform-ca
              configMap:
                name: platform-ca-bundle
            - name: airflow-dags
              configMap:
                name: airflow-dags
            - name: airflow-include
              configMap:
                name: airflow-include
            - name: airflow-sources
              configMap:
                name: airflow-sources
  kubernetesExecutors:
    config:
      logging:
        enableVectorAgent: false
      resources:
        cpu:
          min: 100m
          max: 1000m
        memory:
          limit: 1Gi
    envOverrides:
      REQUESTS_CA_BUNDLE: /etc/platform-ca/ca.crt
      SSL_CERT_FILE: /etc/platform-ca/ca.crt
      PYTHONPATH: /opt/odap/airflow/include:/stackable/app/log_config:/stackable/airflow/dags
    podOverrides:
      spec:
        containers:
        - name: base
          envFrom:
          - secretRef:
              name: uc11-multiplatform-creds
              optional: true
          volumeMounts:
          - name: platform-ca
            mountPath: /etc/platform-ca
            readOnly: true
          - name: airflow-dags
            mountPath: /stackable/airflow/dags
            readOnly: true
          - name: airflow-include
            mountPath: /opt/odap/airflow/include
            readOnly: true
          - name: airflow-sources
            mountPath: /opt/odap/airflow/sources
            readOnly: true
        volumes:
        - name: platform-ca
          configMap:
            name: platform-ca-bundle
        - name: airflow-dags
          configMap:
            name: airflow-dags
        - name: airflow-include
          configMap:
            name: airflow-include
        - name: airflow-sources
          configMap:
            name: airflow-sources
