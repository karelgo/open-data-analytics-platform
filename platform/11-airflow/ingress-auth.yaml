# Aparte ingress voor /airflow/auth/* — Airflow 3 mount't de FAB-provider
# (Flask) als WSGIMiddleware op /auth binnen de FastAPI-main-app. Wanneer
# de hoofd-ingress X-Forwarded-Prefix=/airflow stuurt, overschrijft FAB's
# ProxyFix `x_prefix=1` Flask's SCRIPT_NAME naar /airflow — daarmee
# verdwijnt het /auth-mount-deel. Resultaat: url_for("appbuilder.static")
# rendert /airflow/static/appbuilder/... terwijl de echte route
# /airflow/auth/static/appbuilder/... is. Browser krijgt 404 op
# bootstrap.min.css → de hidden Bootstrap-modal in baselayout.html
# verschijnt als "User confirmation needed"-tekst zonder styling.
#
# Door deze tweede ingress on the meer-specifieke pad /airflow/auth
# (nginx-ingress kiest altijd de meest-specifieke path-match) krijgen
# alleen FAB-rendered requests X-Forwarded-Prefix=/airflow/auth. De
# main-ingress blijft /airflow for the React-SPA + /api/v2-routes.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow-auth
  namespace: odap-platform
  annotations:
    cert-manager.io/cluster-issuer: platform-issuer
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Port 8443;
      proxy_set_header X-Forwarded-Prefix /airflow/auth;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header Content-Security-Policy "frame-ancestors 'self' https://platform.odap.local:8443 https://platform.example.com https://platform.example.com" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["platform.odap.local"]
      secretName: airflow-platform-tls
  rules:
    - host: platform.odap.local
      http:
        paths:
          - path: /airflow/auth
            pathType: Prefix
            backend:
              service:
                name: airflow-webserver
                port:
                  number: 8080
