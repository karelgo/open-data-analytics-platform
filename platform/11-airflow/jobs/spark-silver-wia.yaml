# SparkApplication-template — silver batch voor WIA-aanvragen.
#
# Wordt door DAG transform_wia_spark.silver_wia ge-`envsubst`'d en ge-applied.
# Placeholders die Airflow invult:
#   ${RUN_ID}  — unique suffix (bv. {{ ds_nodash }}-{{ ti.try_number }})
#
# NIET in platform/08-spark/kustomization.yaml — deze template wordt per
# DAG-run dynamisch aangemaakt en na completion door TTL opgeruimd.
---
apiVersion: spark.stackable.tech/v1alpha1
kind: SparkApplication
metadata:
  name: silver-wia-${RUN_ID}
  namespace: odap-platform
  labels:
    odap.io/zone: silver
    odap.io/use-case: wia-spark-demo
    odap.io/dag: transform_wia_spark
spec:
  sparkImage:
    productVersion: "3.5.8"
  mode: cluster
  mainApplicationFile: "local:///stackable/spark/jobs/batch_silver_claims.py"
  s3connection:
    reference: s3-minio
  deps:
    requirements: []
    packages:
      - io.delta:delta-spark_2.12:3.2.1
      - org.apache.hadoop:hadoop-aws:3.3.6
  sparkConf:
    spark.sql.shuffle.partitions: "4"
    spark.kubernetes.driver.deleteOnTermination: "true"
    spark.kubernetes.executor.deleteOnTermination: "true"
    # MERGE-target read-optimisatie.
    spark.databricks.delta.merge.repartitionBeforeWrite.enabled: "true"
    # Event-logs → SparkHistoryServer (zie platform/08-spark/history-server.yaml).
    spark.eventLog.enabled: "true"
    spark.eventLog.dir: "s3a://odap-checkpoints/spark-events/"
  driver:
    config:
      logging:
        enableVectorAgent: false  # vector aggregator CM bestaat niet op deze cluster
      resources:
        cpu:
          min: "200m"
          max: "1000m"
        # 1.5Gi → na JVM-overhead ~900MB heap; Spark eist System memory >472MB.
        memory:
          limit: "1500Mi"
    podOverrides:
      spec:
        containers:
          - name: spark
            envFrom:
              - configMapRef:
                  name: platform-config
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: accessKey
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: secretKey
            volumeMounts:
              - name: spark-jobs
                mountPath: /stackable/spark/jobs
        volumes:
          - name: spark-jobs
            configMap:
              name: spark-streaming-jobs
  executor:
    replicas: 1
    config:
      logging:
        enableVectorAgent: false  # vector aggregator CM bestaat niet op deze cluster
      resources:
        cpu:
          min: "200m"
          max: "1000m"
        # 1.5Gi → executor JVM heap >472MB (Spark-minimum).
        memory:
          limit: "1500Mi"
    podOverrides:
      spec:
        containers:
          - name: spark
            envFrom:
              - configMapRef:
                  name: platform-config
            env:
              - name: S3_ACCESS_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: accessKey
              - name: S3_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: minio-s3-credentials
                    key: secretKey
            volumeMounts:
              - name: spark-jobs
                mountPath: /stackable/spark/jobs
        volumes:
          - name: spark-jobs
            configMap:
              name: spark-streaming-jobs
