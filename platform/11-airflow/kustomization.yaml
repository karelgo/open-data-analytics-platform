apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: odap-platform
resources:
  - airflowcluster.yaml
  - ingress.yaml
  - ingress-auth.yaml
  - webserver-config.yaml
  - spark-launcher-rbac.yaml
  - job-market-settings.yaml
configMapGenerator:
  - name: airflow-dags
    files:
      - .airflowignore=dags/.airflowignore
      - dags/__init__.py
      - dags/dutch_it_jobs_daily.py
  - name: airflow-include
    files:
      - include/__init__.py
      - include/k8s_helpers.py
      - include/governance_factory.py
  - name: airflow-sources
    literals:
      - use_case=dutch-it-job-market
generatorOptions:
  disableNameSuffixHash: true
