# Source registry — FEZ claim_cost (geaggregeerd).
#
# Afwijkend: geen BSN, mode=batch (maandelijks).
schema_version: 1

name: fez
domain: fez

stream:
  name: finance.expense
  key: jaar_maand_wet_regio   # composite, niet per persoon

bronze:
  catalog: bronze
  schema: demo
  table: finance_expense
  partition_by: event_date

silver:
  catalog: silver
  schema: finance
  staging_model: stg_finance_expense
  dbt_tag: fez

governance:
  legal_basis: Wet_SUWI_art_5
  purpose-limitation: [verantwoording, sturingsinfo, prognose]
  bio_classificatie: intern
  retention period_jaren: 10
  eigenaar: divisie_fez
  pii_kolommen: []
  risk_tier: laag

sla:
  mode: batch
  expected_event_freq: monthly
  max_acceptable_lag_seconds: 86400      # 1 dag
  alert_threshold_seconds: 259200        # 3 dagen

used_by_use_cases: [uc06]
anchor: false
