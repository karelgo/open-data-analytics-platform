# Source registry — polisadministratie (IKV's: inkomstenverhouding).
schema_version: 1

name: polisadm
domain: polisadm

stream:
  name: customers.policy
  key: bsn

bronze:
  catalog: bronze
  schema: demo
  table: policy_holders
  partition_by: event_date

silver:
  catalog: silver
  schema: policies
  staging_model: stg_policy_holders
  dbt_tag: polisadm

governance:
  legal_basis: Wet_SUWI_art_33
  purpose-limitation: [claim payout, handhaving, statistiek]
  bio_classificatie: vertrouwelijk
  retention period_jaren: 7
  eigenaar: divisie_gegevensdiensten
  pii_kolommen: [bsn, werkgever_loonheffingennummer]
  risk_tier: midden

sla:
  mode: streaming
  expected_event_freq: continuous
  max_acceptable_lag_seconds: 180
  alert_threshold_seconds: 600

used_by_use_cases: [uc04, uc05, uc07, uc11]
anchor: false
