apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-dashboards-init-script
  namespace: odap-platform
data:
  build_dashboards.py: |
    """Build the single Dutch IT Job Market dashboard."""
    import json
    import os
    import sys
    import time
    from typing import List, Optional, Tuple
    from urllib.parse import urljoin

    import requests

    SUPERSET_URL = os.environ.get("SUPERSET_URL", "http://superset-node:8088")
    ADMIN_USER = os.environ.get("ADMIN_USER", "odap")
    ADMIN_PW   = os.environ["ADMIN_PASSWORD"]



    def log(m): print(f"[dash] {m}", flush=True)


    def login() -> requests.Session:
        s = requests.Session()
        r = s.post(urljoin(SUPERSET_URL, "/api/v1/security/login"),
                   json={"username": ADMIN_USER, "password": ADMIN_PW,
                         "provider": "db", "refresh": True})
        r.raise_for_status()
        s.headers["Authorization"] = f"Bearer {r.json()['access_token']}"
        r = s.get(urljoin(SUPERSET_URL, "/api/v1/security/csrf_token/"))
        r.raise_for_status()
        s.headers["X-CSRFToken"] = r.json()["result"]
        return s


    def get_dataset_id(s, name: str) -> int:
        deadline = time.monotonic() + 600
        while True:
            r = s.get(urljoin(SUPERSET_URL, "/api/v1/dataset/"),
                params={"q": f"(filters:!((col:table_name,opr:eq,value:{name})))"}, timeout=30)
            r.raise_for_status()
            results = r.json().get("result", [])
            if results:
                return results[0]["id"]
            if time.monotonic() > deadline:
                raise RuntimeError(f"Dataset {name} not registered; run the extraction and dbt pipeline first")
            time.sleep(10)


    def find_chart_id(s, slice_name: str) -> Optional[int]:
        """Vind een chart op slice_name. Client-side filter omdat slice_names
        special chars bevatten (em-dash, accenten, parens) die de rison-
        inline-filter doen falen → server gaf 0 hits → script maakte een
        duplicaat. Bug-historie: 4× elke UC-11 chart na 4 init-runs.

        Client-side filter is robuust: één GET met page_size=100 dekt onze
        ~50 charts. Voor production-volumes >100 paginating uitbreiden.
        """
        r = s.get(urljoin(SUPERSET_URL, "/api/v1/chart/"),
                  params={"q": "(page:0,page_size:100)"})
        if r.status_code != 200:
            return None
        for row in r.json().get("result", []):
            if row.get("slice_name") == slice_name:
                return row["id"]
        return None


    def build_query_context(dataset_id: int, viz_type: str, params: dict) -> str:
        """Genereer een query_context for a chart.

        Superset 4.x weigert chart-data renderen als `query_context` leeg
        is ("Chart has no query context saved. Please save the chart
        again."). Normaal vult de UI dit bij elk save; bij API-creatie
        moeten we het zelf zetten. Eén query with the metrics/groupby/time
        uit `params` is genoeg voor line/pie/big_number_total.
        """
        # `metric` (single) en `metrics` (list) moeten allebei in de
        # query als list. big_number_total gebruikt `metric` (single).
        metrics = params.get("metrics", [])
        if not metrics and params.get("metric"):
            metrics = [params["metric"]]

        # Vertaal adhoc_filters naar een SQL WHERE-fragment dat Superset's
        # query_context begrijpt. Adhoc-filters uit form_data zijn frontend-
        # objecten; query_context.filters wil simpele "col / op / val"-records,
        # maar voor combinaties als "IS NOT NULL" is een directe WHERE-string
        # robuuster en sluit aan op bestaande extras.where.
        def _adhoc_to_where(adhoc_filters):
            clauses = []
            for f in adhoc_filters or []:
                if f.get("expressionType") == "SQL" and f.get("sqlExpression"):
                    clauses.append(f["sqlExpression"])
                    continue
                col = f.get("subject")
                op = (f.get("operator") or "").upper()
                if not col or not op:
                    continue
                if op in ("IS NULL", "IS NOT NULL"):
                    clauses.append(f"{col} {op}")
                elif op in ("==", "=", "EQUALS"):
                    val = f.get("comparator")
                    if val is not None:
                        clauses.append(f"{col} = '{val}'")
                elif op == "IN":
                    vals = f.get("comparator") or []
                    if vals:
                        vlist = ",".join(f"'{v}'" for v in vals)
                        clauses.append(f"{col} IN ({vlist})")
            return " AND ".join(clauses)

        adhoc_where = _adhoc_to_where(params.get("adhoc_filters"))

        query = {
            "filters": [],
            "extras": {"having": "", "where": adhoc_where},
            "applied_time_extras": {},
            "columns": params.get("groupby", []),
            "metrics": metrics,
            "annotation_layers": [],
            "row_limit": params.get("row_limit", 1000),
            "series_limit": 0,
            "order_desc": True,
            "url_params": {},
            "custom_params": {},
            "custom_form_data": {},
        }
        # Time series: alleen BASE_AXIS, géén granularity_sqla/is_timeseries.
        # Combinatie van beide gaf in 4.x SQL met dubbele tijd-kolom én
        # `event_ts` in GROUP BY zonder time-grain → 1000 ongebucked rows en
        # "Unexpected error" in de UI:
        #   SELECT event_ts AS __timestamp,
        #          date_trunc('month', CAST(event_ts AS TIMESTAMP)) AS event_ts, ...
        #   GROUP BY date_trunc(...), domein, event_ts
        # Modern echarts viz_types (`echarts_timeseries_line` etc.) lezen het
        # BASE_AXIS-resultaat direct; geen `__timestamp` kolom nodig.
        time_col = params.get("x_axis") or params.get("granularity_sqla")
        if time_col:
            query["time_range"] = "No filter"
            time_axis = {
                "timeGrain": params.get("time_grain_sqla", "P1D"),
                "columnType": "BASE_AXIS",
                "sqlExpression": time_col,
                "label": time_col,
                "expressionType": "SQL",
            }
            # Multi-series: BASE_AXIS-tijd eerst, daarna groupby-dimensies.
            extra_dims = [
                g for g in params.get("groupby", [])
                if g and g != time_col
            ]
            query["columns"] = [time_axis, *extra_dims]

        return json.dumps({
            "datasource": {"id": dataset_id, "type": "table"},
            "force": False,
            "queries": [query],
            "form_data": {**params, "datasource": f"{dataset_id}__table"},
            "result_format": "json",
            "result_type": "full",
        })


    def create_chart(s, dataset_id: int, slice_name: str, viz_type: str,
                     params: dict) -> int:
        """Idempotent upsert van een chart.

        Bestaande chart wordt geüpdate via PUT (params + query_context); zo
        worden script-wijzigingen aan params/build_query_context altijd
        toegepast bij re-deploy zonder dat we charts handmatig hoeven te
        deleten.
        """
        # Echarts `pie` leest `form_data.metric` (single), niet `metrics`
        # (list). Met alleen `metrics` rendert de chart "Unexpected error";
        # de query_context-data klopt wél. We normaliseren hier zodat de
        # chart-specs uniform `metrics: [...]` mogen blijven gebruiken.
        if viz_type == "pie" and "metrics" in params and "metric" not in params:
            params = {**params, "metric": params["metrics"][0]}
            params.pop("metrics", None)

        body_payload = {
            "datasource_id": dataset_id,
            "datasource_type": "table",
            "viz_type": viz_type,
            "slice_name": slice_name,
            "params": json.dumps(params),
            "query_context": build_query_context(dataset_id, viz_type, params),
        }
        existing = find_chart_id(s, slice_name)
        if existing:
            r = s.put(urljoin(SUPERSET_URL, f"/api/v1/chart/{existing}"),
                      json=body_payload)
            if r.status_code != 200:
                log(f"  ! chart update {existing} ({slice_name}) failed: "
                    f"{r.status_code} {r.text[:200]}")
                r.raise_for_status()
            log(f"  ~ chart '{slice_name}' (id={existing}) bijgewerkt")
            return existing
        r = s.post(urljoin(SUPERSET_URL, "/api/v1/chart/"), json=body_payload)
        if r.status_code not in (200, 201):
            log(f"  ! chart create failed: {r.status_code} {r.text[:200]}")
            r.raise_for_status()
        cid = r.json()["id"]
        log(f"  + chart '{slice_name}' (id={cid})")
        return cid


    def find_dashboard_id(s, slug: str) -> Optional[int]:
        # Zoek op slug (unique key, geen spaties → rison-safe).
        # Bug-historie: zoeken op `dashboard_title` met spaties in de
        # waarde liet de rison-filter falen → script vond bestaand
        # dashboard niet en POST'te opnieuw → 422 slug-conflict.
        r = s.get(urljoin(SUPERSET_URL, "/api/v1/dashboard/"),
                  params={"q": f"(filters:!((col:slug,opr:eq,value:{slug})))"})
        if r.status_code == 200 and r.json().get("count", 0) > 0:
            return r.json()["result"][0]["id"]
        return None


    def build_position_json(
        charts: List[Tuple[int, str]],
        widths: Optional[List[int]] = None,
        heights: Optional[List[int]] = None,
    ) -> str:
        """Bouw een Superset dashboard layout-tree (12-kolom grid).

        Charts worden in rijen geplaatst; charts vullen een rij tot
        som(widths)<=12, daarna start een nieuwe rij. `widths` is een lijst
        met breedtes (1..12) per chart; default is full-width (12).
        `heights` werkt analoog (default 50). Geeft een geldige tree met
        ROOT → GRID → ROW(s) → CHART(s). Zonder dit blijft de canvas leeg
        ook al staan de slices in de M2M-tabel, want het frontend leest
        position_json om de chart-components te plaatsen.
        """
        if widths is None:
            widths = [12] * len(charts)
        if heights is None:
            heights = [50] * len(charts)

        layout = {
            "DASHBOARD_VERSION_KEY": "v2",
            "ROOT_ID": {"type": "ROOT", "id": "ROOT_ID", "children": ["GRID_ID"]},
            "GRID_ID": {
                "type": "GRID", "id": "GRID_ID", "children": [],
                "parents": ["ROOT_ID"],
            },
        }
        row_idx = 0
        current_row_id = None
        current_row_used = 0
        for idx, ((chart_id, slice_name), width, height) in enumerate(
            zip(charts, widths, heights),
        ):
            width = max(1, min(12, int(width)))
            if current_row_id is None or current_row_used + width > 12:
                row_idx += 1
                current_row_id = f"ROW-{row_idx}"
                current_row_used = 0
                layout["GRID_ID"]["children"].append(current_row_id)
                layout[current_row_id] = {
                    "type": "ROW", "id": current_row_id, "children": [],
                    "parents": ["ROOT_ID", "GRID_ID"],
                    "meta": {"background": "BACKGROUND_TRANSPARENT"},
                }
            chart_block_id = f"CHART-{idx + 1}"
            layout[current_row_id]["children"].append(chart_block_id)
            layout[chart_block_id] = {
                "type": "CHART", "id": chart_block_id, "children": [],
                "parents": ["ROOT_ID", "GRID_ID", current_row_id],
                "meta": {
                    "chartId": chart_id,
                    "width": width,
                    "height": int(height),
                    "sliceName": slice_name,
                },
            }
            current_row_used += width
        return json.dumps(layout)


    def upsert_dashboard(s, title: str, slug: str,
                         charts: List[Tuple[int, str]],
                         widths: Optional[List[int]] = None,
                         heights: Optional[List[int]] = None) -> int:
        """Maak of update dashboard met slices + position_json.

        Idempotent: bestaand dashboard wordt ook ge-PUT zodat charts +
        layout altijd in sync zijn met dit script.
        """
        chart_ids = [c[0] for c in charts]
        position_json = build_position_json(charts, widths, heights)

        did = find_dashboard_id(s, slug)
        if did is None:
            r = s.post(urljoin(SUPERSET_URL, "/api/v1/dashboard/"),
                       json={"dashboard_title": title, "slug": slug, "published": True})
            r.raise_for_status()
            did = r.json()["id"]
            log(f"  + dashboard '{title}' (id={did})")
        else:
            log(f"  = dashboard '{title}' bestaat (id={did}); update layout")

        # 1. Koppel elke chart aan dit dashboard via chart-PUT.
        #    Dashboard-PUT accepteert geen `slices` (read-only); de M2M
        #    moet via /api/v1/chart/{id} met `dashboards: [...]`.
        for cid in chart_ids:
            r = s.put(urljoin(SUPERSET_URL, f"/api/v1/chart/{cid}"),
                      json={"dashboards": [did]})
            if r.status_code != 200:
                log(f"  ! chart {cid} → dashboard {did}: "
                    f"{r.status_code} {r.text[:200]}")
                r.raise_for_status()

        # 2. Zet de canvas-layout. Zonder position_json blijft de
        # dashboard-pagina leeg, ook al staan de slices in de M2M-tabel.
        r = s.put(urljoin(SUPERSET_URL, f"/api/v1/dashboard/{did}"),
                  json={"position_json": position_json})
        if r.status_code != 200:
            log(f"  ! dashboard {did} layout PUT: "
                f"{r.status_code} {r.text[:300]}")
            r.raise_for_status()
        log(f"  ✓ {len(chart_ids)} charts gekoppeld + layout gezet")
        return did


    def main() -> int:
        log(f"Wachten op Superset...")
        for _ in range(60):
            try:
                if requests.get(urljoin(SUPERSET_URL, "/health"), timeout=5).status_code == 200:
                    break
            except requests.RequestException:
                pass
            time.sleep(5)

        s = login()

        # Helpers voor metric-spec — vermindert herhaling.
        def metric(col, agg="SUM", typ="INTEGER", label=None):
            return {
                "expressionType": "SIMPLE",
                "column": {"column_name": col, "type": typ},
                "aggregate": agg,
                "label": label or f"{agg} {col}",
            }

        # 6 dashboards, 1 per actieve use-case. Per dashboard:
        #   dataset (table_name in Superset)
        #   charts: list of (slice_name, viz_type, params)
        #   layout: chart-order top→down in dashboard
        DASHBOARDS = [{
            "slug": "dutch-it-job-market",
            "title": "Dutch IT Job Market — daily observed vacancies",
            "dataset": "mart_job_inventory",
            "charts": [
                ("Latest observed distinct job candidates", "big_number_total", {
                    "metric": metric("duplicate_group_id", "COUNT_DISTINCT", "VARCHAR", "Jobs")}, {"width":4,"height":30}),
                ("Hiring employers in latest snapshot", "big_number_total", {
                    "metric": metric("company", "COUNT_DISTINCT", "VARCHAR", "Employers")}, {"width":4,"height":30}),
                ("Collection date", "table", {"groupby":["snapshot_date","is_synthetic"],
                    "metrics":[metric("duplicate_group_id","COUNT_DISTINCT","VARCHAR","Jobs")]}, {"width":4,"height":30}),
                ("Observed demand per domain (domains overlap)", "echarts_timeseries_line", {
                    "x_axis":"snapshot_date", "time_grain_sqla":"P1D", "groupby":["domain"],
                    "metrics":[metric("observed_jobs")],"show_legend":True},
                    {"dataset":"mart_job_demand_daily","width":12,"height":55}),
                ("Skills by domain and collection date", "table", {
                    "groupby":["snapshot_date","domain","skill"], "metrics":[metric("observed_jobs")],
                    "query_mode":"aggregate","row_limit":1000},
                    {"dataset":"mart_job_skills","width":6,"height":60}),
                ("Annual EUR salary samples (estimated separated)", "table", {
                    "groupby":["snapshot_date","domain","seniority","salary_is_estimated"],
                    "metrics":[metric("salary_sample_size"), metric("avg_annual_midpoint_eur","AVG","DOUBLE"),
                        metric("median_annual_midpoint_eur","AVG","DOUBLE")], "query_mode":"aggregate"},
                    {"dataset":"mart_job_salary","width":6,"height":60}),
                ("Geography by city and province", "table", {
                    "groupby":["snapshot_date","domain","city","province"], "metrics":[metric("observed_jobs")],
                    "query_mode":"aggregate"}, {"dataset":"mart_job_geography","width":6,"height":55}),
                ("Contracts, remote work and seniority", "table", {
                    "groupby":["snapshot_date","domain","work_mode","employment_type","contract_type","seniority"],
                    "metrics":[metric("observed_jobs")],"query_mode":"aggregate"},
                    {"dataset":"mart_job_work_arrangements","width":6,"height":55}),
                ("Source coverage and freshness (successful extracts)", "table", {
                    "groupby":["snapshot_date","source"],"metrics":[metric("source_observations"),
                        metric("salary_present"),metric("skills_present"),metric("estimated_salary_observations")],
                    "query_mode":"aggregate"}, {"dataset":"mart_job_source_quality","width":12,"height":55}),
            ],
        }]

        # Bouw alle dashboards.
        # Chart-spec format (3-tuple legacy): (slice_name, viz_type, params)
        # Chart-spec format (4-tuple uitbreid): (slice_name, viz_type, params, extras)
        #   extras: {"dataset": "<override>", "width": 1..12, "height": 30..120}
        # Per-dashboard kan ook `dataset` overschreven worden per chart; default
        # is `dash["dataset"]`.
        for dash in DASHBOARDS:
            log(f"=== {dash['title']} ===")
            try:
                default_ds_id = get_dataset_id(s, dash["dataset"])
            except SystemExit:
                log(f"  SKIP — dataset {dash['dataset']!r} niet gevonden")
                continue
            log(f"  dataset id (default): {default_ds_id}")

            ds_cache: dict = {dash["dataset"]: default_ds_id}

            def resolve_ds(name: str) -> Optional[int]:
                if name in ds_cache:
                    return ds_cache[name]
                try:
                    did = get_dataset_id(s, name)
                except SystemExit:
                    return None
                ds_cache[name] = did
                return did

            chart_specs: List[Tuple[int, str]] = []
            widths: List[int] = []
            heights: List[int] = []
            for chart_spec in dash["charts"]:
                if len(chart_spec) == 4:
                    slice_name, viz_type, params, extras = chart_spec
                else:
                    slice_name, viz_type, params = chart_spec
                    extras = {}

                ds_name = extras.get("dataset", dash["dataset"])
                ds_id = resolve_ds(ds_name)
                if ds_id is None:
                    log(f"  SKIP chart '{slice_name}' — dataset {ds_name!r} niet gevonden")
                    continue

                full_params = {
                    "datasource": f"{ds_id}__table",
                    "viz_type": viz_type,
                    "row_limit": 1000,
                    **params,
                }
                cid = create_chart(s, ds_id, slice_name, viz_type, full_params)
                chart_specs.append((cid, slice_name))
                widths.append(int(extras.get("width", 12)))
                heights.append(int(extras.get("height", 50)))

            upsert_dashboard(
                s, dash["title"], dash["slug"], chart_specs,
                widths=widths, heights=heights,
            )

        log(f"Klaar — {len(DASHBOARDS)} dashboards gebouwd.")
        return 0


    if __name__ == "__main__":
        sys.exit(main())
---
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-dashboards-init
  namespace: odap-platform
  labels:
    odap.io/component: superset-dashboards-init
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        odap.io/component: superset-dashboards-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: build-dashboards
        image: python:3.11-slim
        command:
        - bash
        - -euo
        - pipefail
        - -c
        args:
        - |
          pip install --quiet --disable-pip-version-check requests
          python /scripts/build_dashboards.py
        env:
        - name: SUPERSET_URL
          value: http://superset-node:8088
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: superset-postgres-credentials
              key: adminUser.username
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: superset-postgres-credentials
              key: adminUser.password
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: scripts
        configMap:
          name: superset-dashboards-init-script
