# Service + Ingress voor Superset.
# Stackable maakt alleen headless Services; voor browser-access is een
# normale ClusterIP Service + nginx-ingress nodig.
---
apiVersion: v1
kind: Service
metadata:
  name: superset
  namespace: odap-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: superset
    app.kubernetes.io/instance: superset
  ports:
    - name: http
      port: 8088
      targetPort: 8088
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: superset
  namespace: odap-platform
  annotations:
    cert-manager.io/cluster-issuer: platform-issuer
    # Superset (Flask-AppBuilder) bouwt OAuth redirect_uri vanuit
    # request-context via ProxyFix. ingress-nginx stuurt X-Forwarded-Proto
    # en X-Forwarded-Host standaard, maar geen X-Forwarded-Port. K3d mapt
    # host:8443 naar cluster:443, dus zonder X-Forwarded-Port bouwt Superset
    # een URL zonder :8443 → browser landt op port 443 die niet luistert.
    #
    # Iframe-allow for the portal embed-shell (cross-origin). Zonder
    # frame-ancestors hier zou Superset's default Talisman-CSP de iframe
    # blokkeren; X-Frame-Options strippen want sommige Stackable-versies
    # zetten 'm op DENY.
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-Forwarded-Port 8443;
      proxy_hide_header X-Frame-Options;
      add_header Content-Security-Policy "frame-ancestors 'self' https://platform.odap.local:8443 https://platform.example.com https://platform.example.com" always;
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["superset.odap.local"]
      secretName: superset-tls
  rules:
    - host: superset.odap.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: superset
                port:
                  number: 8088
