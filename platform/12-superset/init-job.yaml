apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-init-script
  namespace: odap-platform
data:
  init_superset.py: |
    """Register the single Dutch IT job-market dataset family, idempotently."""
    import json
    import os
    import time
    from urllib.parse import urljoin
    import requests

    BASE = os.getenv('SUPERSET_URL', 'http://superset-node:8088')
    TABLES = ['mart_job_inventory', 'mart_job_demand_daily', 'mart_job_skills',
              'mart_job_salary', 'mart_job_geography', 'mart_job_work_arrangements',
              'mart_job_source_quality']


    def main():
        s = requests.Session()
        deadline = time.monotonic() + 600
        while True:
            try:
                r = s.get(urljoin(BASE, '/health'), timeout=10)
                if r.ok:
                    break
            except requests.RequestException:
                pass
            if time.monotonic() > deadline:
                raise TimeoutError('Superset did not become healthy')
            time.sleep(5)
        r = s.post(urljoin(BASE, '/api/v1/security/login'), json={
            'username':os.environ['ADMIN_USER'], 'password':os.environ['ADMIN_PASSWORD'],
            'provider':'db', 'refresh':True}, timeout=30)
        r.raise_for_status()
        s.headers['Authorization'] = 'Bearer ' + r.json()['access_token']
        r = s.get(urljoin(BASE, '/api/v1/security/csrf_token/'), timeout=30)
        r.raise_for_status(); s.headers['X-CSRFToken'] = r.json()['result']
        def request(method, path, **kwargs):
            r = s.request(method, urljoin(BASE, path), timeout=60, **kwargs)
            r.raise_for_status()
            return r.json() if r.content else {}
        databases = request('GET', '/api/v1/database/', params={'q':'(page:0,page_size:100)'})['result']
        existing = next((d for d in databases if d['database_name']=='trino-gold'), None)
        if existing:
            db_id = existing['id']
        else:
            host = os.getenv('TRINO_HOST', 'trino-coordinator.odap-platform.svc.cluster.local')
            body={'database_name':'trino-gold', 'sqlalchemy_uri':f'trino://smoketest@{host}:8443/gold',
                  'expose_in_sqllab':True, 'allow_ctas':False, 'allow_cvas':False, 'allow_dml':False,
                  'extra':json.dumps({'engine_params':{'connect_args':{'http_scheme':'https'}}})}
            db_id = request('POST','/api/v1/database/',json=body)['id']
        # Table creation can still be running during a first deployment. Retry
        # metadata refresh rather than publishing a dashboard with empty schemas.
        for table in TABLES:
            deadline = time.monotonic() + 600
            while True:
                try:
                    datasets=request('GET','/api/v1/dataset/',params={'q':f'(filters:!((col:table_name,opr:eq,value:{table})))'})['result']
                    existing=next((d for d in datasets if d.get('schema')=='job_market'),None)
                    did=existing['id'] if existing else request('POST','/api/v1/dataset/',json={
                        'database':db_id,'schema':'job_market','table_name':table})['id']
                    request('PUT',f'/api/v1/dataset/{did}/refresh')
                    print(f'Registered gold.job_market.{table}',flush=True)
                    break
                except requests.HTTPError:
                    if time.monotonic() > deadline: raise
                    time.sleep(10)


    if __name__ == '__main__':
        main()
---
apiVersion: batch/v1
kind: Job
metadata:
  name: superset-init
  namespace: odap-platform
  labels:
    odap.io/component: superset-init
    odap.io/dev-only: 'true'
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 2
  template:
    metadata:
      labels:
        odap.io/component: superset-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: python:3.11-slim
        command:
        - bash
        - -euo
        - pipefail
        - -c
        args:
        - |-
          pip install --quiet --disable-pip-version-check requests==2.32.3
          python /scripts/init_superset.py
        env:
        - name: SUPERSET_URL
          value: http://superset-node:8088
        - name: ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: superset-postgres-credentials
              key: adminUser.username
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: superset-postgres-credentials
              key: adminUser.password
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
      volumes:
      - name: scripts
        configMap:
          name: superset-init-script
