    _team, _domain, _dp = {}, {}, {}
    def _ref(kind, name, cache):
        if name in cache: return cache[name]
        r = requests.get(f"{OM}/api/v1/{kind}/name/{name}", headers=H, timeout=10)
        if r.status_code != 200:
            print(f"  ! {kind}/{name} status={r.status_code}"); cache[name] = None; return None
        cache[name] = {"id": r.json()["id"], "name": name, "type": kind.rstrip("s")}
        return cache[name]
    def team_ref(n):   return _ref("teams", n, _team)
    def domain_ref(n): return _ref("domains", n, _domain)
    def dp_ref(n):     return _ref("dataProducts", n, _dp)

    def tag(fqn, source="Classification"):
        return {"tagFQN": fqn, "source": source, "labelType": "Automated", "state": "Confirmed"}

    def get_table(fqn):
        r = requests.get(
            f"{OM}/api/v1/tables/name/{quote(fqn, safe='.')}"
            "?fields=tags,owners,extension,columns,domains,dataProducts",
            headers=H, timeout=15)
        return r.json() if r.status_code == 200 else None

    _schema_seen: set[str] = set()

    def ensure_schema(database: str, schema: str) -> bool:
        """Garandeer dat het databaseSchema bestaat. Trino-catalog-ingest
        creëert deze normaal; voor de demo-synth maken we ze on-the-fly
        zodat UC's zonder Trino-table (bv. UC-12) ook landen."""
        fqn = f"{SERVICE}.{database}.{schema}"
        if fqn in _schema_seen: return True
        r = requests.get(f"{OM}/api/v1/databaseSchemas/name/{quote(fqn, safe='.')}",
                         headers=H, timeout=10)
        if r.status_code == 200:
            _schema_seen.add(fqn); return True
        body = {"name": schema, "database": f"{SERVICE}.{database}"}
        r = requests.post(f"{OM}/api/v1/databaseSchemas", headers=JH,
                          data=json.dumps(body), timeout=15)
        if r.status_code in (200, 201, 409):
            _schema_seen.add(fqn); return True
        print(f"  ! CREATE schema {fqn} status={r.status_code} body={r.text[:200]}")
        return False

    def put_table(database, schema, name, cols, description):
        if not ensure_schema(database, schema):
            return None
        body = {
            "name": name,
            "databaseSchema": f"{SERVICE}.{database}.{schema}",
            "columns": cols,
            "description": description,
        }
        r = requests.put(f"{OM}/api/v1/tables", headers=JH, data=json.dumps(body), timeout=20)
        if r.status_code in (200, 201):
            return r.json()
        print(f"  ! PUT {body['databaseSchema']}.{name} status={r.status_code} body={r.text[:200]}")
        return None

    def patch_table(table, ops, label):
        if not ops: return True
        r = requests.patch(f"{OM}/api/v1/tables/{table['id']}", headers=PH,
                           data=json.dumps(ops), timeout=20)
        if r.status_code in (200, 201):
            print(f"    + {label}: {len(ops)} ops"); return True
        print(f"    ! {label} status={r.status_code} body={r.text[:200]}"); return False

    def build_ops_for_mart(table, m):
        ops = []
        owner_ref = team_ref(m["owner"])
        if owner_ref and not table.get("owners"):
            ops.append({"op": "add", "path": "/owners", "value": [owner_ref]})
        dom = domain_ref(m["domain"])
        if dom and not table.get("domains"):
            ops.append({"op": "add", "path": "/domains", "value": [dom]})
        dp = dp_ref(m["dataProduct"])
        if dp and not table.get("dataProducts"):
            ops.append({"op": "add", "path": "/dataProducts", "value": [dp]})
        tags = [tag(t) for t in m["tags"]]
        for g in m["glossary"]:
            tags.append(tag(f"CGM.{g}", "Glossary"))
        if tags and not table.get("tags"):
            ops.append({"op": "add", "path": "/tags", "value": tags})
        if m["ext"] and not table.get("extension"):
            ops.append({"op": "add", "path": "/extension", "value": m["ext"]})
        # PII per kolom — UNION met bestaande tags (idempotent op re-run).
        columns = table.get("columns") or []
        name_to_idx = {(c.get("name") or "").lower(): idx for idx, c in enumerate(columns)}
        for col_name, pii in m["pii_cols"].items():
            idx = name_to_idx.get(col_name.lower())
            if idx is None: continue
            existing_ct = columns[idx].get("tags") or []
            if any(t.get("tagFQN") == pii for t in existing_ct):
                continue
            merged = existing_ct + [tag(pii)]
            ops.append({
                "op": "add" if not existing_ct else "replace",
                "path": f"/columns/{idx}/tags",
                "value": merged,
            })
        return ops

    # Bookkeeping voor de eindverificatie. OM 1.12 dataProduct.assets is GEEN
    # persistent veld meer (zoals in 1.5 was) — de UI Data Product-pagina
    # rendert assets via search-query `dataProducts.name.keyword:X` op
    # table_search_index. Bidirectie is dus automatisch zolang:
    #   1. table.dataProducts is gezet (gebeurt hierboven via build_ops_for_mart)
    #   2. de OS-index die referentie heeft (gebeurt op table-PATCH door OM)
    #   3. de OS fielddata-bug op glossaryTags/classificationTags is gefixt
    #      (zie om-fix-search-mapping.sh).
    expected_assets: dict[str, int] = {}

    created = enriched = errs = 0
    for m in MARTS:
        # Beide zones — gold is wat testsuites + Superset gebruiken; bronze
        # spiegelt de dbt-manifest realiteit (alles materialiseert daar).
        for db in ("bronze", "gold"):
            fqn = f"{SERVICE}.{db}.{m['schema']}.{m['name']}"
            existing = get_table(fqn)
            if existing:
                print(f"  = {fqn} (bestaat al — {len(existing.get('columns') or [])} kolommen)")
                table = existing
                # Als bestaande tabel-kolommen incompleet zijn, patch met volle set.
                if len(table.get("columns") or []) < len(m["columns"]):
                    patch_table(table,
                                [{"op": "replace", "path": "/columns", "value": m["columns"]}],
                                "kolommen aanvullen")
                    table = get_table(fqn) or table
            else:
                table = put_table(db, m["schema"], m["name"], m["columns"], m["description"])
                if not table: errs += 1; continue
                created += 1
                print(f"  + {fqn} CREATE")
            ops = build_ops_for_mart(table, m)
            if patch_table(table, ops, f"verrijk {fqn}"):
                enriched += 1
            expected_assets[m["dataProduct"]] = expected_assets.get(m["dataProduct"], 0) + 1

    # Eindverificatie: zou de UI per dataProduct de juiste aantallen assets
    # tonen? Search-index kan een lag hebben t.o.v. table-PATCHes; loggen
    # zonder fail zodat operator weet of een reindex/touch nodig is.
    print("Verificatie: dataProduct → assets via search-index")
    for product_name, expected in sorted(expected_assets.items()):
        r = requests.get(
            f"{OM}/api/v1/search/query"
            f"?q=dataProducts.name.keyword:{product_name}"
            f"&index=table_search_index&size=0",
            headers=H, timeout=15)
        if r.status_code != 200:
            print(f"  ? {product_name}: search-call faalde ({r.status_code})")
            continue
        actual = r.json().get("hits", {}).get("total", {}).get("value", 0)
        flag = "✓" if actual >= expected else "?"
        print(f"  {flag} {product_name:<22} expected={expected:>2}  search-index={actual}")

    print(f"Klaar. created={created} enriched={enriched} errors={errs}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: om-demo-seed
  namespace: odap-meta
  labels:
    odap.io/component: openmetadata-demo-seed
    odap.io/dev-only: "true"
spec:
  ttlSecondsAfterFinished: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        odap.io/component: openmetadata-demo-seed
    spec:
      restartPolicy: Never
      containers:
        - name: synth
          image: python:3.11-slim
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              pip install --quiet --disable-pip-version-check requests
              python /scripts/synth.py
          env:
            - name: OM_URL
              value: "http://openmetadata.odap-meta.svc.cluster.local:8585"
            - name: OM_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openmetadata-admin
                  key: jwtToken
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
      volumes:
        - name: scripts
          configMap:
            name: om-demo-seed-script
