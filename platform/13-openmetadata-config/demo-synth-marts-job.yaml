    INT  = {"dataType": "BIGINT"}
    DBL  = {"dataType": "DOUBLE"}
    DT   = {"dataType": "DATE"}
    TS   = {"dataType": "TIMESTAMP"}
    BOOL = {"dataType": "BOOLEAN"}

