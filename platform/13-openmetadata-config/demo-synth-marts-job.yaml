# OpenMetadata demo-seed Job — synthetiseert UC-mart tabel-entities + verrijking.
#
# Achtergrond:
#   De productie-pipeline is: dbt build (materialiseert tabellen in Trino)
#   → Trino-catalog ingest (registreert tables in OM) → dbt-ingest (linkt
#   dbt-models aan OM-tables) → enrich_from_dbt_meta.py (PATCH tags, owner,
#   domain, dataProduct, custom-properties).
#
#   Op een verse cluster of na een Trino-reset zijn alleen de UC-11 marts
#   gematerialiseerd (door uc11_full_setup-DAG). De andere UC-marts
#   (uc01/uc04/uc05/uc06/uc07/uc09/uc_customer_satisfaction/dq_overview) staan wel
#   gedefinieerd in dbt/ maar zijn nog niet gebouwd → komen ook niet in OM.
#
#   Deze Job creëert die tabel-entities rechtstreeks via de OM REST-API
#   met representatieve kolommen + verrijking (owner, domain, dataProduct,
#   Tier/Doelbinding/LegalBasis/Confidentiality/AI-Risk-tags, CGM glossary,
#   custom-properties, PII-tags). Geen Trino-coupling — de tabellen
#   bestaan alleen in OM, voor demo-doeleinden.
#
#   Idempotent: re-runs slaan bestaande tabellen over (en patchen alleen
#   ontbrekende kolommen). Na een dbt-build + Trino-catalog ingest wordt
#   de kolom-lijst overschreven door de echte Trino-discovered kolommen;
#   alle PATCH-based enrichment (owner/domain/dataProduct/tags/extension)
#   blijft behouden.
#
# Trigger:
#   make om-demo-seed
#   OF: kubectl apply -f platform/13-openmetadata-config/demo-synth-marts-job.yaml
#
# Pre-conditions die de Job verwacht (allemaal door init-Job aangelegd):
#   - databaseSchemas onder trino (bronze + gold per UC)
#   - Teams (divisie_*, knowledge_center, data_steward_*)
#   - Domains (AG, WW, CRM, FEZ, Polisadm, Klantcontact, Governance)
#   - DataProducts (uc01_claims_funnel, uc04_..., ...)
#   - Classifications + Glossary CGM
#   - Custom-property types geregistreerd op Table-entity
#
# SYNTHETIC DATA — OPEN DATA AND ANALYTICS PLATFORM — NOT FOR REAL USE.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: om-demo-seed-script
  namespace: odap-meta
  labels:
    odap.io/component: openmetadata-demo-seed
    odap.io/dev-only: "true"
data:
  synth.py: |
