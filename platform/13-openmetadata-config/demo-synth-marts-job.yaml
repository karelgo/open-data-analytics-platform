    JH = {"Authorization": f"Bearer {os.environ['OM_JWT_TOKEN']}", "Content-Type": "application/json"}
    PH = {"Authorization": f"Bearer {os.environ['OM_JWT_TOKEN']}", "Content-Type": "application/json-patch+json"}

    def varchar(n=256): return {"dataType": "VARCHAR", "dataLength": n}
    def col(name, dtype=None, desc=None):
