{
  "glossary": {
    "name": "CGM",
    "displayName": "Dutch IT Job Market",
    "description": "Definitions for the single job-market data product. Existing CGM identifier retained for integration compatibility.",
    "reviewers": [
      "data.steward"
    ],
    "owner": {
      "type": "user",
      "name": "data.steward"
    }
  },
  "terms": [
    {
      "name": "JobPosting",
      "displayName": "Job posting",
      "description": "A source-specific advert with source ID and canonical URL. An advert is not necessarily a unique vacancy."
    },
    {
      "name": "DailySnapshot",
      "displayName": "Daily snapshot",
      "description": "Jobs observed for one logical collection date; bounded searches do not establish total market inventory or closure."
    },
    {
      "name": "Employer",
      "displayName": "Employer",
      "description": "Organization named by the posting; recruiting agencies may differ from the actual employer."
    },
    {
      "name": "Skill",
      "displayName": "Skill",
      "description": "Versioned deterministic keyword evidence in the advert. Missing evidence is not proof a skill is unnecessary."
    },
    {
      "name": "Domain",
      "displayName": "IT domain",
      "description": "Multi-label: Data, Cloud, SAP, AI, Software and Security. Domain totals are not additive."
    },
    {
      "name": "Salary",
      "displayName": "Salary",
      "description": "Stated currency and period retained; annual EUR figures use 12 times monthly, excluding hourly and unknown periods. Estimates are identified separately."
    },
    {
      "name": "DuplicateGroup",
      "displayName": "Potential duplicate group",
      "description": "Conservative normalized employer/title/city match. Retains source observations; can combine distinct roles sharing those values."
    }
  ]
}
