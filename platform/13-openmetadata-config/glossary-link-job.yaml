# OpenMetadata glossary-link Job — koppelt CGM-glossary-termen aan de tables
# waar ze logisch bij horen.
#
# Achtergrond:
#   De init-Job seedt de CGM-glossary (termen + reviewers/owners). De
#   enrich_from_dbt_meta.py-script PATCHt elke dbt-mart met de
#   `cgm_entiteiten[]` uit dbt meta — maar dat dekt alleen mart-niveau.
#   Bronze stg_*-tabellen krijgen geen glossary-koppeling want hun meta
#   wordt direct from the Trino-catalog gehaald (geen dbt-meta).
#
#   Daarnaast missen sommige termen iedere koppeling (Customer journey,
#   EventStream, Fase, Persona, Werknemer, Werkgever, Dienstverband,
#   Ontslag, Diagnose, Inkomen, Huishouden, Aggregaat, Uitkomst).
#
#   Deze Job vult die gaten with a handgemaakte logische mapping
#   (term → (schema, table)-paren). Voor elk paar koppelt het de
#   bronze/silver/gold versies via PATCH /tables met UNION op tags
#   (idempotent — bestaande tags blijven staan).
#
# Trigger:
#   make om-glossary-link
#   OF: kubectl apply -f platform/13-openmetadata-config/glossary-link-job.yaml
#
# Pre-conditions:
#   - openmetadata-init heeft glossary CGM geseed.
#   - Tabellen waarop gekoppeld wordt bestaan al in OM (via Trino-catalog-
#     ingest of via 'make om-demo-seed').
#
# SYNTHETIC DATA — OPEN DATA AND ANALYTICS PLATFORM — NOT FOR REAL USE.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: om-glossary-link-script
  namespace: odap-meta
  labels:
    odap.io/component: openmetadata-glossary-link
    odap.io/dev-only: "true"
data:
  link.py: |
    """Koppel CGM-glossary-termen aan logisch passende tables in OM."""
    import json, os, requests
    from urllib.parse import quote

    OM = os.environ["OM_URL"].rstrip("/")
    H = {"Authorization": f"Bearer {os.environ['OM_JWT_TOKEN']}", "Accept": "application/json"}
    PH = {"Authorization": f"Bearer {os.environ['OM_JWT_TOKEN']}", "Content-Type": "application/json-patch+json"}
    SERVICE = os.environ.get("OM_TRINO_SERVICE", "trino")
    ZONES = ("bronze", "silver", "gold")

    # CGM-term → lijst (schema, table)-paren. Script propageert elke koppel
    # over alle drie de medallion-zones (bronze/silver/gold); ontbrekende
    # zones worden overgeslagen. Termen waarvoor geen dbt-model bestaat
    # (Beoordelaar/Capaciteit/Doelgroepregister) zijn niet in deze map.
    LINKS = {
        # Customer journey-cluster — UC-11 + intermediate
        "Customer journey": [
            ("uc11_customer_journey", "mart_uc11_journey_events"),
            ("uc11_customer_journey", "mart_uc11_journey_phases"),
            ("intermediate", "int_customer_journey_events"),
        ],
        "EventStream": [
            ("uc11_customer_journey", "mart_uc11_journey_events"),
            ("intermediate", "int_customer_journey_events"),
        ],
        "Fase": [
            ("uc11_customer_journey", "mart_uc11_journey_phases"),
        ],

        # Cliënt-domein
        "Client": [
            ("persons", "stg_persons"),
        ],
        "Persona": [
            ("persons", "stg_persons"),
        ],

        # Polisadm / IKV (één bron-tabel dekt werknemer × werkgever × dienstverband)
        "IKV": [
            ("policies", "stg_policy_holders"),
        ],
        "Werknemer": [
            ("policies", "stg_policy_holders"),
        ],
        "Werkgever": [
            ("policies", "stg_policy_holders"),
        ],
        "Dienstverband": [
            ("policies", "stg_policy_holders"),
        ],

        # Aanvraag / Assessment — over wet-domeinen heen
        "Aanvraag": [
            ("service_requests", "stg_service_request_application"),
            ("claims", "stg_claim_application"),
            ("eligibility_cases", "stg_eligibility_case"),
        ],
        "Assessment": [
            ("claims", "stg_claim_application"),
            ("eligibility_cases", "stg_eligibility_case"),
        ],
        "Ontslag": [
            ("service_requests", "stg_service_request_application"),
        ],

        # Operational (sensitive — alleen op bron, niet op marts)
        "Diagnose": [
            ("incidents", "stg_incident_report"),
            ("eligibility_cases", "stg_eligibility_case"),
        ],

        # CRM
        "Contact": [
            ("customers", "stg_customer_interaction"),
        ],
        "Kanaal": [
            ("customers", "stg_customer_interaction"),
        ],

        # FEZ / Claim payout
        "Claim payout": [
            ("finance", "stg_finance_expense"),
        ],
        "Aggregaat": [
            ("finance", "stg_finance_expense"),
            ("uc06_cost_forecast", "mart_uc06_cost_5y"),
            ("uc06_cost_forecast", "mart_uc06_scenario_results"),
        ],
        "Inkomen": [
            ("intermediate", "int_huishouden_inkomen"),
            ("uc04_eligibility_outreach", "mart_uc04_eligibility_outreach"),
        ],
        "Huishouden": [
            ("intermediate", "int_huishouden_inkomen"),
            ("uc04_eligibility_outreach", "mart_uc04_eligibility_outreach"),
        ],

        # Reintegration — UC-09
        "Traject": [
            ("uc09_reintegration_effect", "mart_uc09_effect_panel"),
        ],
        "Werkhervatting": [
            ("uc09_reintegration_effect", "mart_uc09_effect_panel"),
        ],
        "Uitkomst": [
            ("uc09_reintegration_effect", "mart_uc09_effect_panel"),
        ],
    }

    def tag(fqn):
        return {"tagFQN": fqn, "source": "Glossary", "labelType": "Manual", "state": "Confirmed"}

    def get_table(fqn):
        r = requests.get(
            f"{OM}/api/v1/tables/name/{quote(fqn, safe='.')}?fields=tags",
            headers=H, timeout=15)
        return r.json() if r.status_code == 200 else None

    def patch_add_tag(table, term_fqn):
        existing = table.get("tags") or []
        if any(t.get("tagFQN") == term_fqn for t in existing):
            return "exists"
        merged = existing + [tag(term_fqn)]
        ops = [{
            "op": "add" if not existing else "replace",
            "path": "/tags",
            "value": merged,
        }]
        r = requests.patch(f"{OM}/api/v1/tables/{table['id']}",
                           headers=PH, data=json.dumps(ops), timeout=20)
        if r.status_code in (200, 201): return "linked"
        return f"err status={r.status_code} body={r.text[:150]}"

    linked = exists = missing = errs = 0
    for term, targets in LINKS.items():
        term_fqn = f"CGM.{term}"
        for schema, table in targets:
            for zone in ZONES:
                fqn = f"{SERVICE}.{zone}.{schema}.{table}"
                t = get_table(fqn)
                if not t:
                    missing += 1
                    continue
                result = patch_add_tag(t, term_fqn)
                if result == "linked":
                    linked += 1
                    print(f"  + {term_fqn} → {zone}.{schema}.{table}")
                elif result == "exists":
                    exists += 1
                else:
                    errs += 1
                    print(f"  ! {term_fqn} → {fqn}  {result}")
    print(f"Klaar. linked={linked} already_present={exists} table_missing={missing} errors={errs}")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: om-glossary-link
  namespace: odap-meta
  labels:
    odap.io/component: openmetadata-glossary-link
    odap.io/dev-only: "true"
spec:
  ttlSecondsAfterFinished: 1800
  backoffLimit: 0
  template:
    metadata:
      labels:
        odap.io/component: openmetadata-glossary-link
    spec:
      restartPolicy: Never
      containers:
        - name: link
          image: python:3.11-slim
          command: ["bash", "-euo", "pipefail", "-c"]
          args:
            - |
              pip install --quiet --disable-pip-version-check requests
              python /scripts/link.py
          env:
            - name: OM_URL
              value: "http://openmetadata.odap-meta.svc.cluster.local:8585"
            - name: OM_JWT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: openmetadata-admin
                  key: jwtToken
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 256Mi}
      volumes:
        - name: scripts
          configMap:
            name: om-glossary-link-script
