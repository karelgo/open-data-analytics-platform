# Airflow pipeline-ingestion. Levert DAGs + tasks + run-history.
---
source:
  type: airflow
  serviceName: airflow
  serviceConnection:
    config:
      type: Airflow
      hostPort: http://airflow-webserver.odap-platform.svc.cluster.local:8080
      connection:
        # OM 1.5 BackendConnection vereist dat de ingest-pod IN dezelfde
        # Airflow-context draait (gebruikt Airflow's eigen DB-config). Wij
        # draaien een aparte KPO-pod, dus directe PostgresConnection.
        type: Postgres
        username: odap
        authType:
          password: ${AIRFLOW_DB_PW}
        hostPort: postgres-postgresql.odap-data.svc.cluster.local:5432
        database: airflow
  sourceConfig:
    config:
      type: PipelineMetadata
      includeLineage: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata.odap-meta.svc.cluster.local:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT_TOKEN}
