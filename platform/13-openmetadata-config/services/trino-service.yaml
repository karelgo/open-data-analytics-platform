# OpenMetadata Trino service-connection + ingestion-workflow.
#
# Wordt through the init-Job toegepast via `metadata ingest -c trino-service.yaml`.
# Schema-filter dekt alle platform catalogs (bronze/silver/gold/sensitive).
#
# JWT-token komt uit Secret openmetadata-admin (env-substitutie in Job).
---
source:
  type: trino
  serviceName: trino
  serviceConnection:
    config:
      type: Trino
      hostPort: trino-coordinator.odap-platform.svc.cluster.local:8443
      username: smoketest
      # Stackable's Trino draait met `authentication: []` — geen password-
      # authenticator. Auth komt via X-Trino-User header (impersonation),
      # autorisatie via OPA. Daarom GEEN authType.password hier; de DBAPI
      # gebruikt dan alleen de username-header.
      # `catalog:` bewust niet gezet — we willen alle medallion-zones zien;
      # de databaseFilterPattern hieronder beperkt het.
      verify: "False"
      connectionArguments:
        http_scheme: https
  sourceConfig:
    config:
      type: DatabaseMetadata
      # `sensitive` bewust uitgesloten: smoketest (ingestion-user) heeft
      # geen access tot sensitive (art. 9 AVG-zone) — een SELECT op
      # `sensitive.information_schema.schemata` levert OPA-deny en faalt
      # de hele workflow. Sensitive-metadata-ingest vereist een aparte
      # workflow with a break-glass / sensitive-bot user (zie roadmap).
      databaseFilterPattern:
        includes:
          - bronze
          - silver
          - gold
      schemaFilterPattern:
        includes: [job_market]
      includeTables: true
      includeViews: true
      markDeletedTables: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata.odap-meta.svc.cluster.local:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_JWT_TOKEN}
