# Declaratieve DataQuality TestSuites + TestCases for the gold marts.
#
# Wordt through the init-Job (apply_test_suites) toegepast via OM REST API:
#   PUT  /api/v1/dataQuality/testSuites/basic         — per (entity)
#   POST /api/v1/dataQuality/testCases                 — per test in suite
#
# OM 1.12-quirks die in init_openmetadata.py worden afgevangen:
#   - "executable" terminologie is hernoemd naar "basic" (PUT /testSuites/basic).
#   - Basic-suite FQN = `<entityFQN>.testSuite` (hardcoded door OM).
#   - TestCase heeft geen `testSuite`-veld meer; de koppeling wordt afgeleid
#     uit `entityLink`. De `name` uit yaml leeft alleen als displayName.
#   - Suite-creation faalt 404 als de target-tabel nog niet in OM staat —
#     init-job slaat die suites over en logt een waarschuwing.

test_suites:
  # UC-01 WIA Funnel — DoD-anchor, business-critical.
  - name: uc01_claims_funnel_dq
    displayName: "UC-01 WIA Funnel — Data Quality"
    description: "Dagelijkse DQ-checks on the WIA Funnel-mart (Tier1, DoD-anchor)."
    entityFQN: trino.gold.uc01_claims_funnel.mart_uc01_claims_funnel_daily
    test_cases:
      - name: row_count_not_empty
        displayName: "Niet-lege funnel"
        description: "Mart moet minstens 1 rij hebben."
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: aanvraag_datum_not_null
        displayName: "Aanvraagdatum aanwezig"
        column: aanvraag_datum
        testDefinition: columnValuesToBeNotNull
      - name: regio_code_not_null
        column: regio_code
        testDefinition: columnValuesToBeNotNull
      - name: status_in_known_set
        displayName: "Status binnen UWV-workflow"
        column: status
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["INGEDIEND","IN_BEHANDELING","TOEGEKEND","AFGEWEZEN"]'
      - name: n_request_non_negative
        displayName: "n_request >= 0"
        column: n_request
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "0"

  # UC-04 TW Eligibility — proactieve dienstverlening, geen profilering.
  - name: uc04_eligibility_outreach_dq
    displayName: "UC-04 TW Eligibility — Data Quality"
    description: "Regel-gebaseerde TW-aanvulling, geen profilering. Tier1."
    entityFQN: trino.gold.uc04_eligibility_outreach.mart_uc04_eligibility_outreach
    test_cases:
      - name: row_count_not_empty
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: bsn_not_null
        column: bsn
        testDefinition: columnValuesToBeNotNull
      - name: norm_per_maand_positive
        displayName: "TW-norm > 0"
        column: norm_per_maand_eur
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "1"
      - name: inkomen_non_negative
        column: inkomen_maand_eur
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "0"

  # UC-05 Client 360 — vol PII-schema, OPA-policies maskeren per rol.
  - name: uc05_customer_360_dq
    displayName: "UC-05 Cliënt 360° — Data Quality"
    description: "Volledige cliënt-profielen, OPA-masking per rol. Tier1."
    entityFQN: trino.gold.uc05_customer_360.mart_uc05_customer_360
    test_cases:
      - name: row_count_not_empty
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: bsn_not_null
        column: bsn
        testDefinition: columnValuesToBeNotNull
      - name: bsn_unique
        displayName: "Eén rij per BSN"
        column: bsn
        testDefinition: columnValuesToBeUnique
      - name: postcode_format
        displayName: "Postcode 1234AB-formaat"
        description: "NL-postcode (4 cijfers + 2 letters, hoofdletters)."
        column: postcode
        testDefinition: columnValuesToMatchRegex
        parameters:
          - name: regex
            value: '^[1-9][0-9]{3}[A-Z]{2}$'
      - name: geslacht_in_known_set
        column: geslacht
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["M","V","X","O"]'

  # UC-06 Cost forecast — actuariële projectie.
  - name: uc06_cost_dq
    displayName: "UC-06 Cost forecast 5y — Data Quality"
    description: "5-jaars baseline-projectie claim_cost."
    entityFQN: trino.gold.uc06_cost_forecast.mart_uc06_cost_5y
    test_cases:
      - name: row_count_not_empty
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: jaar_in_5y_horizon
        displayName: "Jaar binnen 5-jaars horizon"
        column: jaar
        testDefinition: columnValuesToBeBetween
        parameters:
          - name: minValue
            value: "2026"
          - name: maxValue
            value: "2031"
      - name: maand_1_to_12
        column: maand
        testDefinition: columnValuesToBeBetween
        parameters:
          - name: minValue
            value: "1"
          - name: maxValue
            value: "12"
      - name: wet_in_known_set
        column: wet
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["WIA","WW","Wajong","TW","ZW"]'
      - name: verwachte_last_non_negative
        column: verwachte_last_eur
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "0"

  # UC-07 DQ Polisadm — UC-07 is zelf datakwaliteit; deze suite valideert
  # dat het rapport zelf zinvolle waardes heeft.
  - name: uc07_dq_meta
    displayName: "UC-07 DQ Polisadm — Meta-DQ"
    description: "Datakwaliteit van het dq-dagrapport zelf."
    entityFQN: trino.gold.uc07_dq_policies.mart_uc07_dq_dagrapport
    test_cases:
      - name: rapport_datum_not_null
        column: rapport_datum
        testDefinition: columnValuesToBeNotNull
      - name: bsn_buiten_bereik_is_zero
        displayName: "Geen BSN's buiten test-bereik"
        description: "Verwacht 0 — alle BSNs zouden 9-prefix moeten zijn."
        column: n_bsn_buiten_test_bereik
        testDefinition: columnValueMaxToBeBetween
        parameters:
          - name: maxValueForMaxInCol
            value: "0"
      - name: pct_geldige_iban_above_threshold
        displayName: "pct_geldige_iban >= 95%"
        column: pct_geldige_iban
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "0.95"
      - name: n_ikvs_positive
        column: n_ikvs
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "1"

  # UC-09 Reintegration effect — sandbox, pseudonimisatie.
  - name: uc09_reintegration_effect_dq
    displayName: "UC-09 Reintegration Effect — Data Quality"
    description: "Gepseudonimiseerd onderzoekspanel. Sandbox-zone."
    entityFQN: trino.gold.uc09_reintegration_effect.mart_uc09_effect_panel
    test_cases:
      - name: row_count_not_empty
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: bsn_pseudo_not_null
        column: bsn_pseudo
        testDefinition: columnValuesToBeNotNull
      - name: leeftijd_realistic
        displayName: "Leeftijd 16-100"
        column: leeftijd
        testDefinition: columnValuesToBeBetween
        parameters:
          - name: minValue
            value: "16"
          - name: maxValue
            value: "100"
      - name: huidige_status_in_known_set
        column: huidige_status
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["werkzoekend","ww_claim payout","wia_in_behandeling","reintegration_actief","werkhervat","uit_zicht"]'

  # UC — Klanttevredenheid
  - name: uc_customer_satisfaction_dq
    displayName: "Klanttevredenheid — Data Quality"
    description: "Gewogen score per kanaal × maand."
    entityFQN: trino.gold.uc_customer_satisfaction.mart_uc_customer_satisfaction_kanaal_maand
    test_cases:
      - name: row_count_not_empty
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: kanaal_in_known_set
        column: kanaal
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["telefoon","digitaal","balie","email","chat","brief"]'
      - name: score_in_realistic_range
        displayName: "Score 1.0 ≤ x ≤ 5.0"
        column: gemid_score_gewogen
        testDefinition: columnValuesToBeBetween
        parameters:
          - name: minValue
            value: "1"
          - name: maxValue
            value: "5"
      - name: n_respondenten_positive
        column: n_respondenten
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "1"

  # DQ Overview — cross-UC datakwaliteits-samenvatting.
  - name: dq_overview_dq
    displayName: "DQ Overview — Self-check"
    description: "DQ-mart die alle UCs samenvat; checkt dat output zelf gevuld + valide is."
    entityFQN: trino.gold.dq_overview.mart_dq_overview
    test_cases:
      - name: row_count_not_empty
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: dq_score_pct_in_range
        displayName: "DQ score 0-100%"
        column: dq_score_pct
        testDefinition: columnValuesToBeBetween
        parameters:
          - name: minValue
            value: "0"
          - name: maxValue
            value: "100"
      - name: dq_status_in_known_set
        column: dq_status
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["pass","warn","fail"]'
      - name: uc_code_not_null
        column: uc_code
        testDefinition: columnValuesToBeNotNull

  # UC-11 Customer journey events — cross-domein, Tier1, DoD-anchor.
  - name: uc11_journey_events_dq
    displayName: "UC-11 Customer journey Events — Data Quality"
    description: "Integriteitschecks on the cross-domein event-stream."
    entityFQN: trino.gold.uc11_customer_journey.mart_uc11_journey_events
    test_cases:
      - name: row_count_not_empty
        displayName: "Niet-lege event-stream"
        description: "Mart moet minstens 1 rij hebben (demo: ~50k events)."
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: bsn_not_null
        displayName: "BSN aanwezig"
        description: "BSN is de cliënt-sleutel — mag nooit ontbreken."
        column: bsn
        testDefinition: columnValuesToBeNotNull
      - name: event_ts_not_null
        displayName: "Event-timestamp aanwezig"
        column: event_ts
        testDefinition: columnValuesToBeNotNull
      - name: domein_not_null
        displayName: "Domein aanwezig"
        column: domein
        testDefinition: columnValuesToBeNotNull
      - name: domein_in_known_set
        displayName: "Domein binnen 7-bekende set"
        description: "Spiegelt dbt accepted_values — voorkomt onbekende bron-tags."
        column: domein
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["persons","policies","service_requests","incidents","claims","eligibility_cases","customers"]'
      - name: event_type_not_null
        displayName: "Event-type aanwezig"
        column: event_type
        testDefinition: columnValuesToBeNotNull
      - name: event_seq_positive
        displayName: "event_seq >= 1"
        description: "Volgnummer per BSN; row_number begint bij 1."
        column: event_seq
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "1"

  # UC-11 Customer journey phases — fase-reconstructie (gaps-and-islands).
  - name: uc11_journey_phases_dq
    displayName: "UC-11 Customer journey Phases — Data Quality"
    description: "Checks on the fase-reconstructie (BSN × fase × periode)."
    entityFQN: trino.gold.uc11_customer_journey.mart_uc11_journey_phases
    test_cases:
      - name: row_count_not_empty
        displayName: "Niet-lege fase-tabel"
        testDefinition: tableRowCountToBeBetween
        parameters:
          - name: minValue
            value: "1"
      - name: bsn_not_null
        column: bsn
        testDefinition: columnValuesToBeNotNull
      - name: fase_not_null
        column: fase
        testDefinition: columnValuesToBeNotNull
      - name: fase_in_known_set
        displayName: "Fase binnen UWV-traject-domein"
        description: "Spiegelt dbt accepted_values; voorkomt onbekende fase-labels."
        column: fase
        testDefinition: columnValuesToBeInSet
        parameters:
          - name: allowedValues
            value: '["werknemer","tussen_dienstverband","ziek","service_request_application","ww_claim payout","wia_in_behandeling","wga","iva","wajong_actief"]'
      - name: fase_start_ts_not_null
        column: fase_start_ts
        testDefinition: columnValuesToBeNotNull
      - name: fase_volgnr_positive
        column: fase_volgnr
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "1"
      - name: duur_dagen_non_negative
        displayName: "Geen negatieve fase-duur"
        column: duur_dagen
        testDefinition: columnValueMinToBeBetween
        parameters:
          - name: minValueForMinInCol
            value: "0"
      - name: is_lopend_not_null
        column: is_lopend
        testDefinition: columnValuesToBeNotNull

  # UC-07 DQ Polisadm — UC-07 is zelf datakwaliteit; deze suite valideert
  # dat het rapport zelf zinvolle waardes heeft.
  - name: uc07_dq_meta
    displayName: "UC-07 DQ Polisadm — Meta-DQ"
    description: "Datakwaliteit van het dq-dagrapport zelf."
    entityFQN: trino.gold.uc07_dq_policies.mart_uc07_dq_dagrapport
    test_cases:
      - name: rapport_datum_not_null
        column: rapport_datum
        testDefinition: columnValuesToBeNotNull
      - name: bsn_buiten_bereik_is_zero
        displayName: "Geen BSN's buiten test-bereik"
        description: "Verwacht 0 — alle BSNs zouden 9-prefix moeten zijn."
        column: n_bsn_buiten_test_bereik
        testDefinition: columnValueMaxToBeBetween
        parameters:
          - name: maxValueForMaxInCol
            value: "0"

# Alert / Subscription — notificeert op events. OM 1.5 valideert resource-
# strings strict; "all" werkt overal. Granulair filteren op testCase doe je
# in production via Observability-alert + filtering-rule.
alerts:
  - name: dq_failure_alert
    displayName: "DQ-failure → ops-channel (stub)"
    description: |
      Triggert op events platform-breed. Production: vervang destination door
      Slack-webhook (SLACK_WEBHOOK_URL secret) of email (SMTP-config in
      OM-server) en filter op testStatus=Failed.
    alertType: Notification
    resource: all
    destination:
      type: Webhook
      # k3d-locale endpoint die requests slikt en logt — production vervangt
      # dit with the daadwerkelijke Slack/Teams webhook.
      endpoint: http://openmetadata.odap-meta.svc.cluster.local:8585/api/v1/system/healthz
