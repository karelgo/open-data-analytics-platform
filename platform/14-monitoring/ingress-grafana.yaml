# Ingress voor Grafana onder platform.odap.local/grafana.
# Vervangt de chart-managed ingress op grafana.odap.local
# (uitgeschakeld in infrastructure/helm/prometheus-stack/values.yaml).
# Same-origin met de portal-shell → /embed/grafana kan z'n iframe
# laden zonder cross-origin cookie- of CSP-gedoe.
#
# Service `prometheus-grafana` wordt door kube-prometheus-stack
# gemaakt en luistert intern op poort 80.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: odap-monitoring
  annotations:
    cert-manager.io/cluster-issuer: platform-issuer
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["platform.odap.local"]
      secretName: grafana-platform-tls
  rules:
    - host: platform.odap.local
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: prometheus-grafana
                port:
                  number: 80
