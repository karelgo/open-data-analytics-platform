# PrometheusRule — ODAP platform alerts (improvements #1).
#
# Vereist kube-prometheus-stack (provides PrometheusRule CRD).
# Severity-mapping:
#   critical → page (Alertmanager → PagerDuty)
#   warning  → notify (Alertmanager → Slack #odap-data-platform)
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: odap-platform-alerts
  namespace: odap-monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
    odap.io/policy-tier: production
spec:
  groups:
    - name: trino
      interval: 1m
      rules:
        - alert: TrinoQueryLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(trino_query_execution_seconds_bucket[5m]))
            ) > 5
          for: 10m
          labels:
            severity: warning
            component: trino
          annotations:
            summary: "Trino p99 query-latency > 5s"
            description: "Trino's p99 query-latency is {{ $value | printf \"%.2f\" }}s — boven SLO van 5s. Check workers + OPA-decisions."
            runbook_url: "/docs/runbook.md#41-trino-weigert-query-met-access-denied"

        - alert: TrinoNoActiveQueries
          expr: trino_query_active{cluster="trino"} < 1
          for: 30m
          labels:
            severity: warning
            component: trino
          annotations:
            summary: "Trino heeft 30 min geen active query — broker mogelijk down?"

    - name: opa
      interval: 30s
      rules:
        - alert: OpaDecisionDenyRateHigh
          expr: |
            sum(rate(opa_http_request_duration_seconds_count{code="200",path=~"/v1/data/trino/.*"}[5m]))
            > 0
            and
            (
              sum(rate(opa_decision_logs_dropped_total[5m]))
              /
              clamp_min(sum(rate(opa_decision_logs_total[5m])), 1)
            ) > 0.05
          for: 5m
          labels:
            severity: critical
            component: opa
          annotations:
            summary: "OPA decision deny-rate > 5%"
            description: "OPA weigert > 5% van Trino-queries. Kan duiden op (a) verkeerde rol-mapping na deploy, of (b) compromise. Check decision-log in OpenSearch."
            runbook_url: "/docs/runbook.md#41-trino-weigert-query-met-access-denied"

        - alert: OpaDown
          expr: up{job=~".*opa.*"} == 0
          for: 2m
          labels:
            severity: critical
            component: opa
          annotations:
            summary: "OPA-pod down — Trino weigert ALLE queries (default-deny)"

    - name: postgres
      interval: 1m
      rules:
        - alert: PostgresDiskUsageHigh
          expr: |
            (kubelet_volume_stats_used_bytes{persistentvolumeclaim=~"data-postgres-postgresql-.*"}
             / kubelet_volume_stats_capacity_bytes) > 0.80
          for: 5m
          labels:
            severity: warning
            component: postgres
          annotations:
            summary: "Postgres-PVC > 80% vol"
            description: "Disk-usage {{ $value | humanizePercentage }} — verhoog PVC-size of cleanup oude logs."

        - alert: PostgresDown
          expr: up{job="postgres-postgresql"} == 0
          for: 2m
          labels:
            severity: critical
            component: postgres
          annotations:
            summary: "Postgres down — alle services die 'm gebruiken vallen om (HMS, Airflow, Superset, OM, Keycloak)"

    - name: odap-platform
      interval: 1m
      rules:
        - alert: KubePodNotReadyHigh
          expr: |
            sum by (namespace) (
              kube_pod_status_phase{phase=~"Pending|Failed|Unknown",
                                    namespace=~"uwv-.*"}
            ) > 2
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "≥3 pods NotReady in {{ $labels.namespace }}"

        - alert: NamespaceQuotaUsageHigh
          expr: |
            kube_resourcequota{type="used", resource="requests.cpu", namespace=~"uwv-.*"}
            / kube_resourcequota{type="hard", resource="requests.cpu", namespace=~"uwv-.*"}
            > 0.85
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Namespace {{ $labels.namespace }} CPU-quota > 85%"

    # ---- Hive Metastore ----
    # HMS is the single source of truth for Iceberg/Delta table metadata.
    # If it's down, Trino + Spark + dbt all stop being able to read tables.
    - name: hive
      interval: 1m
      rules:
        - alert: HiveMetastoreDown
          expr: up{job=~".*hive.*metastore.*|.*hive-metastore.*"} == 0
          for: 2m
          labels:
            severity: critical
            component: hive-metastore
          annotations:
            summary: "Hive Metastore is down — Trino + Spark + dbt cannot resolve tables"
            description: >-
              No Prometheus scrape target for hive-metastore is responding.
              Check pod status and the shared Postgres `hivemetastore` database.
            runbook_url: "/docs/runbook.md#44-hive-metastore-postgres-corruption-of-readiness-fail"

    # ---- Airflow ----
    # Stackable's AirflowCluster runs scheduler + webserver as separate
    # StatefulSets. The scheduler is the heartbeat — without it, DAGs stop
    # being parsed and tasks stop being scheduled.
    - name: airflow
      interval: 1m
      rules:
        - alert: AirflowSchedulerHeartbeatLost
          expr: time() - max(airflow_scheduler_heartbeat) > 60
          for: 5m
          labels:
            severity: critical
            component: airflow-scheduler
          annotations:
            summary: "Airflow scheduler heartbeat lost for > 60s"
            description: >-
              The scheduler hasn't emitted a heartbeat in over a minute.
              DAGs are not being scheduled. Check pod, executor, and
              metadata-DB (Postgres `airflow` schema) health.
            runbook_url: "/docs/runbook.md#45-airflow-scheduler-stuck"

        - alert: AirflowDagRunFailureRateHigh
          expr: |
            (
              sum(rate(airflow_dagrun_failed_total[15m]))
              /
              clamp_min(sum(rate(airflow_dagrun_total[15m])), 1)
            ) > 0.10
          for: 15m
          labels:
            severity: warning
            component: airflow
          annotations:
            summary: "Airflow DAG-run failure-rate > 10% (15m window)"
            description: >-
              More than 1-in-10 DAG-runs failed in the last 15 minutes.
              Check `airflow_dag_run_state` per DAG to identify the culprit.

    # ---- MinIO ----
    # MinIO holds the lakehouse storage. Disk-pressure means streaming
    # bronze pipelines and dbt-target writes start failing.
    - name: minio
      interval: 1m
      rules:
        - alert: MinioDiskUsageHigh
          expr: minio_cluster_capacity_usable_free_bytes / minio_cluster_capacity_usable_total_bytes < 0.15
          for: 10m
          labels:
            severity: warning
            component: minio
          annotations:
            summary: "MinIO free capacity < 15%"
            description: >-
              Free usable capacity is {{ $value | humanizePercentage }}.
              Expand the PVC or expire old objects in odap-checkpoints +
              odap-staging buckets.

        - alert: MinioDown
          expr: minio_cluster_nodes_online_total < 1
          for: 2m
          labels:
            severity: critical
            component: minio
          annotations:
            summary: "MinIO down — lakehouse storage unavailable"

    # ---- Cert-manager (TLS expiry) ----
    # Certificates issued by cert-manager are auto-renewed at 2/3 of the
    # validity period; if a renewal fails, we want a warning before the
    # cert actually expires. cert-manager exposes `certmanager_certificate_*`
    # via its metrics port (scraped by the kube-prometheus-stack default).
    - name: cert-manager
      interval: 5m
      rules:
        - alert: CertManagerCertExpiringSoon
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 < 14
            and
            (certmanager_certificate_expiration_timestamp_seconds - time()) / 86400 > 0
          for: 1h
          labels:
            severity: warning
            component: cert-manager
          annotations:
            summary: "Certificate {{ $labels.name }} expires in < 14 days"
            description: >-
              cert-manager hasn't successfully renewed `{{ $labels.name }}` in
              namespace `{{ $labels.namespace }}`. Check the Issuer and the
              CertificateRequest. Auto-renewal normally kicks in at 2/3 of
              validity — if we're inside 14 days, renewal has been failing.
            runbook_url: "/docs/runbook.md#46-tls-cert-rollover-failed"

        - alert: CertManagerCertExpired
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 0
          for: 5m
          labels:
            severity: critical
            component: cert-manager
          annotations:
            summary: "Certificate {{ $labels.name }} HAS EXPIRED"
            description: >-
              `{{ $labels.name }}` in ns `{{ $labels.namespace }}` is past its
              expiration time. Clients will fail TLS handshakes. Recreate the
              Certificate resource immediately.

    # ---- OPA decision latency ----
    # OPA in front of Trino sits in the hot path of every query. Latency
    # spikes here translate directly into user-visible Trino latency.
    - name: opa-latency
      interval: 30s
      rules:
        - alert: OpaDecisionLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum by (le) (rate(opa_http_request_duration_seconds_bucket{path=~"/v1/data/trino/.*"}[5m]))
            ) > 0.05
          for: 10m
          labels:
            severity: warning
            component: opa
          annotations:
            summary: "OPA decision p99 > 50ms — Trino queries will feel slow"
            description: >-
              p99 OPA decision latency is {{ $value | printf "%.3f" }}s.
              Typical target is <10ms. Check OPA bundle-size (data.json) and
              policy-complexity in `opa-policies-src/trino/`.
