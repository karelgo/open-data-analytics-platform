# Ingress voor ODAP Lab under platform.odap.local/jupyter.
# Same-origin met de portal embed-shell (/embed/jupyter).
#
# WebSocket support is vereist voor de kernel-message channel tussen
# browser en notebook-pod; ingress-nginx handelt WS upgrades default.
# Proxy buffers verhogen omdat notebook-output groot kan zijn.
# Lange proxy-timeouts voor live kernel-output (3600s = 1u).
#
# JupyterHub is geconfigureerd met c.JupyterHub.base_url = "/jupyter/"
# (configmap-jupyterhub.yaml) zodat alle interne URLs het /jupyter-prefix
# krijgen.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jupyter
  namespace: odap-platform
  annotations:
    cert-manager.io/cluster-issuer: platform-issuer
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "32k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["platform.odap.local"]
      secretName: jupyter-platform-tls
  rules:
    - host: platform.odap.local
      http:
        paths:
          - path: /jupyter
            pathType: Prefix
            backend:
              service:
                name: jupyter
                port:
                  number: 80
