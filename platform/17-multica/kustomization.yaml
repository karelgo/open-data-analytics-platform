apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: odap-platform

# Note on secrets:
#   postgres-secret.yaml and backend-secret.yaml are TEMPLATES showing the
#   expected keys. They are deliberately NOT listed below — same pattern as
#   19-nanitics-observatory. Apply real values out-of-band:
#
#     kubectl -n odap-platform create secret generic multica-postgres \
#       --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 24) \
#       --dry-run=client -o yaml | kubectl apply -f -
#
#     kubectl -n odap-platform create secret generic multica-backend \
#       --from-literal=JWT_SECRET=$(openssl rand -hex 32) \
#       --from-literal=DATABASE_URL='postgres://multica:<pw>@multica-postgres:5432/multica?sslmode=disable' \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# Listing them here would overwrite the real keys with the placeholders on
# every `kubectl apply -k .`.

resources:
  - uploads-pvc.yaml
  - postgres.yaml
  - backend-config.yaml
  - backend.yaml
  - frontend.yaml
  - configmap-oauth2-proxy.yaml
  - secret-oauth2-proxy.yaml
  - oauth2-proxy.yaml
  - ingress.yaml

# ---- Image pinning ----
#
# `:latest` on the upstream Multica images is silently mutable. We pin to a
# concrete tag here so:
#   - kubectl kustomize emits a deterministic image reference
#   - SBOM/SAST scans (Trivy, Grype, Syft) get a stable target
#   - rollbacks are reproducible
#
# Bumping policy: change to the next upstream release after verifying
# compatibility in k3d first. Ideally pin to a SHA256 digest (e.g.
# `newTag: '@sha256:abc123...'`) — kustomize 5+ supports this via
# `digest:` in the same block. Get a digest with:
#   docker buildx imagetools inspect ghcr.io/multica-ai/multica-backend:v0.6.0
images:
  - name: ghcr.io/multica-ai/multica-backend
    newTag: "v0.6.0" # TODO: replace with `digest: sha256:<...>` once Multica publishes signed images
  - name: ghcr.io/multica-ai/multica-web
    newTag: "v0.6.0" # TODO: same

commonLabels:
  app.kubernetes.io/part-of: odap-platform
  app.kubernetes.io/component: multica
