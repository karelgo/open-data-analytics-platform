# Non-secret runtime config for the OM access-bridge.
#
# `OM_WEBHOOK_SECRET` en `KEYCLOAK_CLIENT_SECRET` zitten in de aparte
# Secret `om-access-bridge-secret` (zie README.md voor bootstrap).
apiVersion: v1
kind: ConfigMap
metadata:
  name: om-access-bridge-config
  namespace: odap-platform
data:
  # The Stackable Keycloak Service exposes :80 (svc.spec.ports[0].port=80,
  # targetPort=http=8080 on the pod). The cluster-internal call must go
  # to :80 — :8080 would hit the headless metrics Service instead and
  # times out on the admin REST API. See bug surfaced in E2E test 2026-05-25.
  KEYCLOAK_URL: "http://keycloak.odap-auth.svc.cluster.local:80"
  KEYCLOAK_REALM: "demo"
  KEYCLOAK_CLIENT_ID: "om-access-bridge"
  REPLAY_WINDOW_SECONDS: "300"
  LOG_LEVEL: "INFO"
  OM_BASE_URL: "http://openmetadata.odap-meta.svc.cluster.local:8585"
  # Browser-origin van het portal-formulier dat POST naar /api/request.
  # In dev: same-origin via ingress-route, dus alleen platform.* whitelist.
  CORS_ALLOWED_ORIGINS: "https://platform.odap.local:8443,https://platform.odap.local"
