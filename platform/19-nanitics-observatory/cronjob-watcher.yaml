# Scheduled platform-watcher runs.
#
# Ships ENABLED (suspend: false). Was suspended-by-default in the
# original slice 4 commit; flipped on once the watcher → Multica path
# was verified end-to-end. To pause without redeploying:
#
#   kubectl -n odap-platform patch cronjob nanitics-watcher-cron \
#     -p '{"spec":{"suspend":true}}'
#
# Cadence: every 30 min by default. concurrencyPolicy=Forbid means a
# long-running ReAct loop will not be overlapped by the next tick — the
# cron interval is the natural rate limiter, not a strict per-day cap.
# If a tight per-day budget becomes necessary, switch the watcher's
# file_multica_task to consult Multica for "tasks filed by me in last
# 24h" and short-circuit when over budget.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nanitics-watcher-cron-body
  namespace: odap-platform
data:
  # Body POSTed to /run/watcher by each cron tick. Kept in a ConfigMap so
  # operators can tweak the prompt without rebuilding the image or
  # editing the CronJob spec.
  body.json: |
    {
      "task": "Scan platform health and file at most ONE Multica issue if you find a real problem. PROCESS: (1) Call recent_k8s_warnings to get Warning events from the last 60 minutes. (2) If there are any, pick the most distinctive one (highest count, or most recent, or most severe-sounding reason). Compute a stable fingerprint from `reason:involved_object_name` (e.g. `Unhealthy:multica-frontend-abc123`). (3) Call find_existing_multica_tasks(fingerprint). If a matching issue already exists, output 'already tracked: <id>' and stop. (4) Otherwise call query_prometheus once to corroborate (e.g. kube_pod_container_status_restarts_total for the involved pod). (5) File ONE issue via file_multica_task with severity=warning, area=k8s, a body following Symptom/Evidence/Hypothesis/Suggested fix/Runbook structure, and the fingerprint. (6) Output 'task filed: <id>'. If recent_k8s_warnings returned no events, output 'no issue found: cluster quiet'. Do NOT call list_firing_alerts — Alertmanager is not deployed in this cluster and the call wastes a tool turn."
    }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nanitics-watcher-cron
  namespace: odap-platform
spec:
  suspend: false
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            # curlimages/curl ships a named user `curl_user` (uid 100);
            # Kubernetes' runAsNonRoot check requires a numeric uid to
            # verify without inspecting the image, so we pin it explicitly.
            runAsUser: 100
            runAsGroup: 100
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trigger
              image: curlimages/curl:8.8.0
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  curl -fsS \
                    -H 'Content-Type: application/json' \
                    --max-time 540 \
                    --data @/etc/watcher/body.json \
                    http://nanitics-observatory.odap-platform.svc.cluster.local/run/watcher \
                    | tee /dev/stderr
              volumeMounts:
                - name: body
                  mountPath: /etc/watcher
                  readOnly: true
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits:   { cpu: 100m, memory: 64Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: body
              configMap:
                name: nanitics-watcher-cron-body
                items:
                  - key: body.json
                    path: body.json
