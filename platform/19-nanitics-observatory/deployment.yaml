apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanitics-observatory
  namespace: odap-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nanitics-observatory
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nanitics-observatory
    spec:
      # Slice 2 needed cluster events access for the watcher's
      # recent_k8s_warnings tool — see rbac.yaml. The SA grants
      # read-only `events` only; no other K8s API surface is reachable.
      serviceAccountName: nanitics-observatory-watcher
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: odap/nanitics-observatory:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: nanitics-observatory-config
            # Azure AI Foundry key is out-of-band (see secret.yaml). Mark
            # optional so the pod starts in dev clusters without an Azure
            # key — the app will refuse AI calls but the Deployment is up.
            # Provision with the kubectl recipe in secret.yaml, then
            # `kubectl rollout restart deploy/nanitics-observatory`.
            - secretRef:
                name: nanitics-azure-foundry
                optional: true
            # Watcher's Multica bearer token. `optional: true` keeps the
            # pod startable while MULTICA_DRY_RUN=true and the real token
            # has not yet been provisioned. See secret-multica.yaml.
            - secretRef:
                name: nanitics-multica-token
                optional: true
            # OpenSearch basic-auth credentials. Optional — empty
            # OPENSEARCH_USERNAME means anonymous (works in dev where
            # the security plugin is permissive). See secret-opensearch.yaml.
            - secretRef:
                name: nanitics-opensearch
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # uvicorn writes a small pid/access log here on some setups;
            # easier to grant a writable tmpfs than fight it.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
