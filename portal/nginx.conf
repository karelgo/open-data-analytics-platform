worker_processes  1;
error_log  /dev/stderr  warn;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # nginx writeable paths zonder root-rechten (image draait als non-root).
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;

  log_format combined '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent"';
  access_log /dev/stdout combined;

  sendfile        on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

  # Prometheus upstream — kube-prometheus-stack chart-naam.
  # Resolver toevoegen zodat nginx niet bij start faalt als de service nog
  # niet bestaat (lazy DNS lookup per request).
  resolver kube-dns.kube-system.svc.cluster.local valid=30s;

  server {
    listen 8080 default_server;
    server_name _;

    # Trailing-slash en directory-index redirects (van bv. /me → /me/) als
    # *relatieve* Location's sturen, niet als absolute `https://host:8080/...`.
    # Anders pikt nginx z'n eigen listen-port :8080 op en stuurt de browser
    # weg van :8443 (ingress) naar :8080 (HTTP-poort) — TLS handshake error.
    absolute_redirect off;
    port_in_redirect off;

    # Security headers — minimaal, OPA / WAF doen de rest.
    # connect-src bevat de MinIO S3-API hosts zodat de CSV-upload pagina
    # (csv-upload.astro) AssumeRoleWithWebIdentity + PUT-object kan doen
    # naar zowel k3d (.local) als AKS (.example.com).
    # frame-src lijst de service-hosts die /embed/<id>-pagina's iframen
    # (Superset, Airflow, Grafana, OpenMetadata, …); zonder die
    # whitelist zou default-src 'self' alle cross-origin iframes blokkeren.
    # Wildcard per cloud-TLD dekt k3d, AKS én StackIT in één string.
    # font-src expliciet met data: omdat dbt-docs static-bundle 3 fonts
    # base64-inline heeft (woff/woff2). Zonder data: in font-src zou
    # font-src naar default-src 'self' fallback'en en de fonts zouden
    # geblokkeerd worden — page rendert maar zonder icons/typografie.
    # X-Frame-Options SAMEORIGIN + frame-ancestors 'self' i.p.v. DENY/'none':
    # /embed/dbt-docs/ iframet de same-origin /dbt-docs.html bundel, dus
    # de portal moet zichzelf kunnen embedden. Externe sites blijven
    # geblokkeerd (alleen same-origin toegestaan).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;
    # connect-src / frame-src bevatten ook https://api.powerbi.com en
    # https://app.powerbi.com — nodig for the Power BI SDK-embed
    # (powerbi-client-react op /embed/powerbi/, zie ADR-0008).
    # img-src https://*.powerbi.com voor tile-thumbnails from the rapport.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.powerbi.com; font-src 'self' data:; connect-src 'self' https://minio.odap.local:8443 https://minio-api.example.com https://api.powerbi.com https://login.microsoftonline.com; frame-src 'self' https://*.odap.local:8443 https://*.example.com https://*.example.com https://app.powerbi.com; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    # Health probe voor smoke test + K8s probes — geen auth nodig.
    location = /api/health {
      access_log off;
      add_header Cache-Control "no-store" always;
      return 200 '{"status":"ok"}';
      default_type application/json;
    }

    # OAuth2 access-token doorgeven aan de browser-JS.
    # oauth2-proxy (sidecar) zet `pass_access_token = true` en stuurt het
    # access-token mee als X-Forwarded-Access-Token op elke upstream-request.
    # De CSV-upload pagina haalt dit hier op en wisselt het bij MinIO STS om
    # voor tijdelijke S3-credentials (AssumeRoleWithWebIdentity).
    # NB: het token is van de ingelogde gebruiker zelf — geen rechten-escalatie.
    # Pad bewust onder /api/ (niet /oauth2/*) om botsing met oauth2-proxy
    # gereserveerde paden te voorkomen.
    location = /api/auth/token {
      access_log off;
      add_header Cache-Control "no-store" always;
      default_type text/plain;
      if ($http_x_forwarded_access_token = "") {
        return 401 "no access token in session";
      }
      return 200 $http_x_forwarded_access_token;
    }

    # Live status endpoint: vraagt up{job=$job} aan Prometheus.
    # We forwarden NIET de hele Prometheus API — alleen de instant query
    # voor `up`. Beperkt blast radius en input-set.
    location ~ ^/api/status/up$ {
      if ($arg_job !~ ^[a-z0-9_-]+$) { return 400; }
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      set $prom_host "prometheus-kube-prometheus-prometheus.odap-monitoring.svc.cluster.local:9090";
      proxy_pass http://$prom_host/api/v1/query?query=up%7Bjob%3D%22$arg_job%22%7D;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @prom_unavailable;

      # Vorm Prometheus-respons om naar simpele {up: 0|1}.
      # Doe dit client-side; nginx stuurt rauwe response.
      add_header Cache-Control "no-store" always;
    }

    location @prom_unavailable {
      add_header Content-Type "application/json" always;
      return 200 '{"status":"unavailable"}';
    }

    # MinIO SSO bootstrap.
    # De embedded MinIO Console (RELEASE.2024-04-18) returnt `redirectRules:null`
    # via de externe ingress (loginStrategy=form, geen Keycloak-knop), maar
    # WERKT WEL via de in-cluster Service-DNS. We proxyen deze ene endpoint
    # in-cluster zodat de portal /go/minio/ pagina het OIDC-redirect-URL
    # kan ophalen en de browser door-302't naar Keycloak.
    location = /api/minio-sso/login {
      access_log off;
      set $minio_console "minio-console.odap-platform.svc.cluster.local:9001";
      proxy_pass https://$minio_console/api/v1/login;
      proxy_ssl_verify off;
      proxy_ssl_server_name on;
      proxy_set_header Host minio-console.odap.local;
      proxy_read_timeout 5s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @minio_unavailable;
      add_header Cache-Control "no-store" always;
    }

    location @minio_unavailable {
      add_header Content-Type "application/json" always;
      return 200 '{"loginStrategy":"form","redirectRules":null,"_error":"minio-unreachable"}';
    }

    # Airflow trigger bridge — sidecar in dezelfde pod (zie deployment.yaml,
    # container `airflow-bridge`). Vertaalt browser-clicks op "Convert to
    # Delta" naar Airflow REST POST /api/v1/dags/convert_to_delta/dagRuns met
    # bot-creds. Sidecar valideert dat de caller's X-Auth-Request-Email
    # overeenkomt with the object_key-prefix vóór doorgeven aan Airflow.
    location ~ ^/api/airflow/ {
      proxy_pass http://127.0.0.1:8089;
      proxy_set_header Host $host;
      proxy_set_header X-Auth-Request-User  $http_x_auth_request_user;
      proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
      proxy_read_timeout 15s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @airflow_bridge_unavailable;
      add_header Cache-Control "no-store" always;
    }

    location @airflow_bridge_unavailable {
      add_header Content-Type "application/json" always;
      add_header Cache-Control "no-store" always;
      return 503 '{"ok":false,"msg":"airflow-bridge sidecar niet beschikbaar"}';
    }

    # Academy backend — voortgang-sync naar Keycloak attributes en
    # auto-checks per module. Optioneel: als de sidecar niet draait
    # blijft de Academy werken op localStorage (zie learn-progress.ts).
    location ~ ^/api/learn/ {
      set $academy_backend "udp-academy-backend.odap-platform.svc.cluster.local:8088";
      proxy_pass http://$academy_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Auth-Request-User $http_x_auth_request_user;
      proxy_read_timeout 10s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @academy_unavailable;
      add_header Cache-Control "no-store" always;
    }

    location @academy_unavailable {
      add_header Content-Type "application/json" always;
      add_header Cache-Control "no-store" always;
      return 503 '{"ok":false,"msg":"academy backend niet beschikbaar"}';
    }

    # Portal backend SSE-stream — apart blok mét proxy_buffering off,
    # anders bufferd nginx events tot de buffer vol is (worst-case bij
    # proxy_read_timeout). Exact-match `= /api/portal/events` zodat
    # deze location wint van de regex `~ ^/api/portal/` hieronder.
    # HTTP/1.1 + lege Connection-header behoudt de stream als chunked
    # i.p.v. dat nginx hem opbreekt in losse responses.
    location = /api/portal/events {
      set $portal_backend "udp-portal-backend.odap-platform.svc.cluster.local:8089";
      proxy_pass http://$portal_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
      proxy_set_header X-Auth-Request-User  $http_x_auth_request_user;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 24h;
      proxy_send_timeout 24h;
      add_header Cache-Control "no-store" always;
    }

    # Portal backend — recents + favorites (fase D) en straks search
    # aggregator (fase 2). Persistent SQLite store via PVC. Forwarder
    # X-Auth-Request-Email zodat de backend kan dedupliceren per user
    # zonder zelf Keycloak te moeten queryen.
    # Bij onbereikbare backend → 503 met JSON-error; de frontend valt
    # dan terug op localStorage / sample data zodat de portal blijft
    # werken zonder backend (handig voor lokale dev en cluster-restart).
    location ~ ^/api/portal/ {
      set $portal_backend "udp-portal-backend.odap-platform.svc.cluster.local:8089";
      proxy_pass http://$portal_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Auth-Request-Email $http_x_auth_request_email;
      proxy_set_header X-Auth-Request-User  $http_x_auth_request_user;
      # 30s: /api/portal/powerbi/embed/<id> kan tot ~20s duren wanneer
      # Power BI `/GenerateToken` met effectiveIdentity moet valideren
      # tegen de fixed-identity cloud connection. Met 10s timeout liet
      # nginx die call afkappen → 503 fallback. Andere /api/portal/*
      # endpoints zijn sub-second en tikken nooit aan tegen 30s.
      proxy_read_timeout 30s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @portal_backend_unavailable;
      add_header Cache-Control "no-store" always;
    }

    location @portal_backend_unavailable {
      add_header Content-Type "application/json" always;
      add_header Cache-Control "no-store" always;
      return 503 '{"ok":false,"msg":"portal backend niet beschikbaar"}';
    }

    # Statische Astro-output. Astro `build.format: directory` produceert
    # `<route>/index.html`; serveer die direct ipv via `$uri/` (wat een
    # 301-trailing-slash-redirect triggert — browsers cachen die
    # permanent en houden dan een eenmalig kapotte port vast).
    location / {
      try_files $uri $uri/index.html $uri.html /index.html;
    }
  }
}
